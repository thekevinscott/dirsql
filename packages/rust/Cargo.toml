[package]
name = "dirsql"
description = "Ephemeral SQL index over a local directory"
# Explicit literal (not `version.workspace = true`) so putitoutthere's
# crates handler can update it via `replaceCargoVersion`. The workspace
# version stays for the binding crates (publish = false). The literal
# intentionally lags the published version: putitoutthere rewrites it to
# the planned release version at build time and never commits it back.
version = "0.2.7"
edition.workspace = true
# Literal `license` (not `license.workspace = true`) because
# putitoutthere's preflight check reads `[package].license` directly
# from the crate's Cargo.toml and does not resolve workspace
# inheritance, surfacing PIOT_CRATES_MISSING_METADATA otherwise.
license = "MIT"
repository.workspace = true
# `docs/` is a symlink to the workspace `docs/` so the markdown ships with the
# crate; everything below is the VitePress build tooling we don't want to ship.
# `tests/` is the integration suite -- excluded so test files never ship in the
# published `.crate` (enforced by the `packaging` gate in CI). Inline unit tests
# stay (they are `#[cfg(test)]` modules inside `src/`, not separate files).
exclude = [
    "tests/",
    "docs/.vitepress",
    "docs/.claude",
    "docs/tests",
    "docs/AGENTS.md",
    "docs/package.json",
    "docs/pnpm-lock.yaml",
    "docs/pnpm-workspace.yaml",
    "docs/playwright.config.ts",
    "docs/vitest.config.ts",
]

[features]
default = []
# Opt-in CLI. Library consumers (`cargo add dirsql`) pull zero CLI deps.
# CLI install: `cargo install dirsql --features cli`.
cli = [
    "dep:axum",
    "dep:clap",
    "dep:futures",
    "dep:tokio-stream",
    "tokio/rt-multi-thread",
    "tokio/macros",
    "tokio/signal",
    "tokio/net",
]

[dependencies]
axum = { version = "0.8", optional = true }
blake3 = "1"
clap = { version = "4", features = ["derive"], optional = true }
futures = { version = "0.3", optional = true }
futures-channel.workspace = true
globset = "0.4"
# Hierarchical `.gitignore` matching for path-table scans (the fd/ripgrep
# semantics), without adopting its walker: the scan keeps `walkdir`.
ignore = "0.4"
notify = "7"
rusqlite = { version = "0.34", features = ["bundled", "load_extension", "hooks", "vtab"] }
serde.workspace = true
serde_json.workspace = true
# Split a command *template* into argv with shell-like quoting (so
# `sh -c '...'` keeps its script as one arg) WITHOUT invoking a shell.
shlex = "1"
thiserror.workspace = true
tokio.workspace = true
tokio-stream = { version = "0.1", features = ["sync"], optional = true }
toml = "0.8"
# Enforce a per-command timeout: wait for the child up to a deadline,
# then kill it. No async runtime required in the core.
wait-timeout = "0.2"
walkdir = "2"

[lints.rust]
# `deny`, not `forbid`: rusqlite's API imposes five unavoidable `unsafe`
# sites (the `load_extension` guard and four `unsafe impl VTab`/`VTabCursor`).
# `forbid` cannot be overridden at all, so it would make the crate
# uncompilable; `deny` blocks new `unsafe` unless a site opts in explicitly
# with `#[expect(unsafe_code, reason = ...)]`, which is the guarantee we
# actually want (#763).
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

# The narrow slice of clippy::pedantic worth enforcing (#763): dirsql marshals
# sizes, timestamps, and row indexes between usize/u64 and SQLite's i64, where
# a silent lossy cast corrupts data. The rest of pedantic is style noise here
# and stays off. Intentional lossy/bit-preserving casts opt out per-site with
# `#[expect(clippy::cast_..., reason = ...)]`.
[lints.clippy]
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"

[[bin]]
name = "dirsql"
path = "src/bin/dirsql.rs"
required-features = ["cli"]

[package.metadata.docs.rs]
no-default-features = true

[dev-dependencies]
assert_cmd = "2"
criterion = { version = "0.5", features = ["html_reports"] }
eventsource-client = "0.13"
futures-executor = "0.3"
futures-util = "0.3"
libc = "0.2"
predicates = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls", "stream"] }
serde_json.workspace = true
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "process"] }

[[bench]]
name = "db_bench"
harness = false

[[bench]]
name = "scanner_bench"
harness = false

[[bench]]
name = "differ_bench"
harness = false

[[bench]]
name = "matcher_bench"
harness = false
