# Per-package config so `[e2e]` can be per-package: it is one global table
# applied to every caller reading a given config, so "the core plus MY binding"
# has nowhere else to live. Folded back into the root file, a PyO3 change would
# start staling this package.
#
# The napi crate is in scope because the npm launcher runs the CLI in-process
# through it (#721), so every e2e case crosses it -- the whole crate dir, since
# Cargo.toml and build.rs decide what lands in the addon. packages/python/src is
# not: it cannot reach this suite.
[e2e]
extra_scope = ["packages/rust/src", "packages/ts/napi"]

# The live TypeScript floors: the root testing-conventions.toml carries no
# `[typescript]` table, since no lane reading it scans TypeScript.
#
# NB: the `[typescript]` table only accepts `coverage` / `exempt` -- there is no
# `[typescript].build_command` (that config key is python-only). The TS
# suite-executing gates (mutation, unit-coverage) load the native napi
# `dirsql.node`; post-#289 that build is provisioned automatically because
# `packages/ts/napi` declares a napi build (auto-provisioning without a
# build_command field), with `rust_toolchain: true` on the caller supplying cargo.
[typescript.coverage]
lines = 100
functions = 100
statements = 100
branches = 100
