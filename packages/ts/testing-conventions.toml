# Dedicated testing-conventions config for packages/ts.
#
# It exists because `[e2e]` is a single global table that detect.py applies to
# every caller reading the config, so a per-package freshness scope is only
# expressible as a per-package config file -- the pattern
# internals/checks/testing-conventions.toml (#550) and the embeddings plugin
# already use, there to DROP a phantom root, here to add a real one. Everything
# else mirrors the root file for this package's gates.

# --- e2e freshness scope (#933) --------------------------------------------
#
# `e2e verify --scope` is packages/ts/src, which reaches neither the shared Rust
# core nor this package's napi binding; both are declared here as extra
# freshness roots.
#
#   packages/rust/src the core compiles into the addon (#337). No `cli/`
#                     carve-out -- the CLI is not gated out of what the e2e
#                     suites run.
#   packages/ts/napi  the napi-rs binding. Since #721 the npm launcher does not
#                     spawn a bundled binary: it calls the addon's `runCli`
#                     in-process (argv framing, exit-code contract), so that
#                     code runs in every e2e case and can change what the
#                     suites exercise with no core change at all. Before #933
#                     nothing scoped it, and a binding-only diff left this
#                     attestation looking fresh.
#
# The whole crate directory, not just its `src/`: Cargo.toml and build.rs
# decide what gets compiled into the addon the suites load. The python side
# lists packages/python/src alone because its crate root IS the package root --
# see packages/python/testing-conventions.toml.
#
# Per-package, not shared: packages/python/src has no bearing on this suite and
# is absent here.
[e2e]
extra_scope = ["packages/rust/src", "packages/ts/napi"]

# Unit-only coverage floor, per vitest metric -- identical to the root file's
# `[typescript.coverage]`.
[typescript.coverage]
lines = 100
functions = 100
statements = 100
branches = 100
