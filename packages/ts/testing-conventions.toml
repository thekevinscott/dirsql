# Per-package config so `[e2e]` can be per-package: it is one global table
# applied to every caller reading a given config, so "the core plus MY binding"
# has nowhere else to live. Folded back into the root file, a PyO3 change would
# start staling this package.
#
# The napi crate is in scope because the npm launcher runs the CLI in-process
# through it (#721), so every e2e case crosses it. The verifier accepts only
# directory scopes, so the package-root Cargo.toml cannot be listed here.
# packages/python/src is not: it cannot reach this suite.
[e2e]
extra_scope = ["packages/rust/src", "packages/ts/napi"]

# The live TypeScript floors; the root file carries no `[typescript]` table.
[typescript.coverage]
lines = 100
functions = 100
statements = 100
branches = 100
