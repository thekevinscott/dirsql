# Fragment shipped by the e2e fixture plugin `dirsql_plugin_fixture`.
# Discovered via the package's `[project.entry-points.dirsql]` declaration and
# injected by the launcher as an ordinary `-c` flag. Adds one table so an
# installed plugin is observable ("installed = active") with zero config edits.
[[table]]
ddl = "CREATE TABLE notes (path TEXT, basename TEXT)"
glob = "*.md"
