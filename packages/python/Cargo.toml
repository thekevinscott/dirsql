[package]
name = "dirsql-py-ext"
# Explicit literal (not `version.workspace = true`) so putitoutthere's
# pypi/maturin handler can rewrite it via `write-version` before
# `maturin build`. `pyproject.toml` declares `dynamic = ["version"]`
# and maturin reads this field. Mirrors `packages/rust/Cargo.toml`.
version = "0.2.7"
# abi3 note: the `abi3-py310` pyo3 feature (below) builds ONE stable-ABI
# `cp310-abi3` wheel per platform that loads on every CPython >= 3.10
# (matching `pyproject.toml`'s `requires-python = ">=3.10"`), instead of
# one wheel per interpreter. putitoutthere's `wheel-abi` detector (#401)
# reads the abi3 feature straight off this direct `pyo3` dependency and
# collapses the per-version build fan to a single wheel -- no
# `putitoutthere.toml` change needed. The floor must stay <= the
# `requires-python` floor or pip finds no compatible wheel on the low end.
edition.workspace = true
publish = false

[lib]
name = "dirsql_py_ext"
crate-type = ["cdylib", "rlib"]

[dependencies]
# `cli` is on so the extension module carries `dirsql::cli::run_cli`: the
# console script calls it in-process instead of exec'ing a bundled binary
# (#738), which is what lets `dirsql/_binary/` leave the wheel.
dirsql = { workspace = true, features = ["cli"] }
pyo3 = { version = "0.28", features = ["extension-module", "generate-import-lib", "abi3-py310"], optional = true }

[lints.rust]
# `deny`, not `forbid`: pyo3's proc macros emit `#[allow(unsafe_code)]`, which
# `forbid` rejects outright (E0453). `deny` still blocks new hand-written
# `unsafe` unless a site opts in explicitly, which is the guarantee we want.
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

# The narrow slice of clippy::pedantic worth enforcing (#763); mirrors the
# core crate's block. No sites in this crate today -- the value is catching
# future lossy casts at the binding boundary.
[lints.clippy]
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"

[features]
default = []
extension-module = ["pyo3/extension-module"]
