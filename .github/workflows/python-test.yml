name: Python Test

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
    paths:
      - 'packages/python/**'
      - 'packages/rust/**'
      - 'Cargo.lock'
  pull_request:
    paths:
      - 'packages/python/**'
      - 'packages/rust/**'
      - 'Cargo.lock'

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install dependencies
        run: uv sync --extra dev
        working-directory: packages/python

      - name: Build Rust extension
        run: uv run maturin develop
        working-directory: packages/python

      - name: Run unit tests
        run: uv run python -m pytest python/ -x -q --tb=short
        working-directory: packages/python

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install dependencies
        run: uv sync --extra dev
        working-directory: packages/python

      - name: Build Rust extension
        run: uv run maturin develop
        working-directory: packages/python

      - name: Run integration tests
        run: uv run python -m pytest tests/integration/ -x -q --tb=short
        working-directory: packages/python

  wheel-e2e:
    # Build CI publishability gate: build a wheel with the bundled Rust
    # CLI binary, install it into a fresh venv, and run `dirsql --version`
    # against the registered console-script entry point. If this job goes
    # red, `uvx dirsql` / `pip install dirsql && dirsql ...` are broken on
    # PyPI and the release must not go out. No mocks / no monkeypatching;
    # exercises the real published-artifact path.
    name: Wheel install smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --extra dev
        working-directory: packages/python

      - name: Run wheel smoke e2e
        run: uv run python -m pytest tests/e2e/test_cli_smoke.py -x -q --tb=short
        working-directory: packages/python

  coverage:
    name: Python coverage floor (90%)
    runs-on: ubuntu-latest
    needs: [unit, integration]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --extra dev
        working-directory: packages/python

      - name: Build Rust extension
        run: uv run maturin develop
        working-directory: packages/python

      - name: Run combined coverage (unit + integration, no e2e)
        run: uv run python -m pytest python/ tests/integration/ -q --tb=short --cov=dirsql --cov-report=term-missing --cov-fail-under=90
        working-directory: packages/python
