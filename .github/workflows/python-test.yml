name: Python Test

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
    paths:
      - 'packages/python/**'
      - 'packages/rust/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/python-test.yml'
  pull_request:
    paths:
      - 'packages/python/**'
      - 'packages/rust/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/python-test.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install just
        uses: extractions/setup-just@v2

      # `uv sync` builds the maturin extension (once implicitly, then again
      # explicitly via `maturin develop` below); the workspace `target/` dir
      # is shared across matrix python versions (there is no per-version
      # target-dir override), so a single Cargo.lock-keyed cache serves both
      # legs of this matrix and every other python-test job.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Install dependencies
        run: uv sync
        working-directory: packages/python

      - name: Build Rust extension
        run: uv run maturin develop
        working-directory: packages/python

      - name: Run unit tests
        run: uv run python -m pytest dirsql/ -x -q --tb=short
        working-directory: packages/python

  integration:
    # Hermetic tier (#289): SDK public API with the Rust core and the
    # filesystem mocked. The PyO3 extension is still built because
    # `dirsql/__init__.py` imports `dirsql._dirsql` at module load.
    name: Integration tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Install dependencies
        run: uv sync
        working-directory: packages/python

      - name: Build Rust extension
        run: uv run maturin develop
        working-directory: packages/python

      - name: Run integration tests
        run: uv run python -m pytest tests/integration/ -x -q --tb=short
        working-directory: packages/python

  binding:
    # Binding tier (#289): the SDK public API against the real PyO3 core and
    # a real filesystem — proves the SDK↔core marshaling that the hermetic
    # integration tier mocks out.
    name: Binding tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Install dependencies
        run: uv sync
        working-directory: packages/python

      - name: Build Rust extension
        run: uv run maturin develop
        working-directory: packages/python

      - name: Run binding tests
        run: uv run python -m pytest tests/binding/ -x -q --tb=short
        working-directory: packages/python

  # Unit coverage now runs in the reusable testing-conventions workflow
  # (conventions.yml, `python-unit` gates: unit-coverage) after upstream #284
  # taught the coverage suite job to install/build from the derived package
  # root (python_env=uv -> `uv sync` builds maturin; provision_rust). The
  # bespoke coverage job that lived here is retired (#412).

  smoke:
    # Functional publishability gate (#344, mirroring ts-test.yml's smoke
    # job): build the real `dirsql` CLI binary via cargo, stage it under
    # `dirsql/_binary/` the way the release pipeline's bundle_cli step
    # would, build the wheel with `maturin build`, `pip install` it into a
    # fresh venv, and run the installed `dirsql --version` console script
    # plus `import dirsql`. Red here means the PyPI release is broken and
    # must not go out. This is the install-and-run check the `packaging`
    # gate does NOT do (that gate only asserts no test files ship in the
    # artifact). No mocks.
    name: Packaging smoke (install + run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync
        working-directory: packages/python

      - name: Build dirsql CLI binary
        run: cargo build -p dirsql --features cli

      - name: Run packaging smoke (build -> pack -> install -> run)
        run: uv run python -m pytest tests/smoke/ -x -q --tb=short
        working-directory: packages/python
