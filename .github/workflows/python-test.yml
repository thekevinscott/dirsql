name: Python Test

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
    paths:
      - 'packages/python/**'
      - 'packages/rust/**'
      - 'Cargo.lock'
  pull_request:
    paths:
      - 'packages/python/**'
      - 'packages/rust/**'
      - 'Cargo.lock'

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install dependencies
        run: uv sync --extra dev
        working-directory: packages/python

      - name: Build Rust extension
        run: uv run maturin develop
        working-directory: packages/python

      - name: Run unit tests
        run: uv run python -m pytest dirsql/ -x -q --tb=short
        working-directory: packages/python

  integration:
    # Hermetic tier (#289): SDK public API with the Rust core and the
    # filesystem mocked. The PyO3 extension is still built because
    # `dirsql/__init__.py` imports `dirsql._dirsql` at module load.
    name: Integration tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install dependencies
        run: uv sync --extra dev
        working-directory: packages/python

      - name: Build Rust extension
        run: uv run maturin develop
        working-directory: packages/python

      - name: Run integration tests
        run: uv run python -m pytest tests/integration/ -x -q --tb=short
        working-directory: packages/python

  binding:
    # Binding tier (#289): the SDK public API against the real PyO3 core and
    # a real filesystem — proves the SDK↔core marshaling that the hermetic
    # integration tier mocks out.
    name: Binding tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install dependencies
        run: uv sync --extra dev
        working-directory: packages/python

      - name: Build Rust extension
        run: uv run maturin develop
        working-directory: packages/python

      - name: Run binding tests
        run: uv run python -m pytest tests/binding/ -x -q --tb=short
        working-directory: packages/python

  coverage:
    name: Python unit coverage floor
    runs-on: ubuntu-latest
    needs: [unit, integration, binding]
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so the PR-only `--base` changed-lines check can diff
          # against the base commit.
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --extra dev
        working-directory: packages/python

      - name: Build Rust extension
        # The colocated unit tests import the `dirsql._dirsql` PyO3 extension at
        # module load (even though they mock it), so it must be built. The
        # standalone `dirsql` binary is NOT needed -- `unit coverage` runs only
        # the colocated unit suite, not the integration tests.
        run: uv run maturin develop
        working-directory: packages/python

      - name: Install testing-conventions
        # Into the project venv so its `coverage run -m pytest` subprocess sees
        # the same pytest / coverage / built extension.
        run: uv pip install testing-conventions
        working-directory: packages/python

      - name: Unit coverage floor (testing-conventions)
        # Replaces the bespoke `pytest --cov --cov-fail-under` gate. Measures the
        # colocated unit suite ONLY (no integration padding); floor in
        # testing-conventions.toml `[python.coverage]`.
        run: uv run testing-conventions unit coverage --language python --config ../../testing-conventions.toml dirsql
        working-directory: packages/python

      - name: Unit coverage floor on changed lines (PR only)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: uv run testing-conventions unit coverage --language python --base "$BASE" --config ../../testing-conventions.toml dirsql
        working-directory: packages/python
