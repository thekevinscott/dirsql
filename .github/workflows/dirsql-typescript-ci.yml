name: dirsql TypeScript CI

# All PR verification for the TypeScript SDK (packages/ts): biome lint, tsc
# typecheck, the napi build + four test tiers, and the testing-conventions
# gate suites for the SDK and the napi binding crate. Merged from ts-lint.yml,
# ts-typecheck.yml, ts-test.yml and two conventions.yml lanes so one paths
# filter governs the whole set.
#
# packages/rust/** fans in: the core compiles into the binding, and
# [e2e].extra_scope means a core change stales this package's attestation.
# No self-path on pull_request, per the #834 stack convention.
on:
  push:
    branches: [main]
    paths:
      - 'packages/ts/**'
      - 'packages/rust/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'testing-conventions.toml'
      - '.github/workflows/dirsql-typescript-ci.yml'
  pull_request:
    paths:
      - 'packages/ts/**'
      - '!packages/ts/changelog.d/**'
      - '!packages/ts/migrations.d/**'
      - '!packages/ts/README.md'
      - 'packages/rust/**'
      - '!packages/rust/changelog.d/**'
      - '!packages/rust/migrations.d/**'
      - '!packages/rust/README.md'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'testing-conventions.toml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Job ids `typescript-sdk` / `rust-napi-binding` kept from their
  # conventions.yml lanes so check-run names are unchanged.
  typescript-sdk:
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@v0
    with:
      languages: '["typescript"]'
      source: packages/ts/src
      config: testing-conventions.toml
      base: ${{ github.event.pull_request.base.sha || 'origin/main' }}
      rust_toolchain: true

  rust-napi-binding:
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@v0
    with:
      languages: '["rust"]'
      source: packages/ts/napi
      config: testing-conventions.toml
      base: ${{ github.event.pull_request.base.sha || 'origin/main' }}
      gates: '["colocated-test", "unit-lint"]'

  lint:
    name: lint (ts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        working-directory: packages/ts
        run: pnpm install

      - name: Lint
        working-directory: packages/ts
        run: pnpm lint

      - name: Format check
        working-directory: packages/ts
        run: pnpm format:check

# `tsc` already runs as part of `pnpm build` in `ts-test.yml`, so this is
# redundant in the strict sense. It exists for the same reason
# `python-typecheck.yml` does: a dedicated, fast-failing type-check signal
# that doesn't require the napi-rs build chain (~seconds instead of minutes)
# and shows up as its own red check rather than "Unit tests" failing on a
# pure type error. The native addon is loaded at runtime via `createRequire`
# (see `src/load-native-core.ts`), so `tsc --noEmit` does not need
# `dirsql.node` or the generated `index.d.ts` to succeed.
  tsc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        working-directory: packages/ts
        run: pnpm install

      - name: Type check
        working-directory: packages/ts
        run: pnpm exec tsc --noEmit

  build:
    # Builds the napi addon once and shares it with unit/binding/distcheck below
    # (#483) instead of each job/matrix-cell rebuilding it independently.
    # The addon is N-API (napi6, see packages/ts/napi/Cargo.toml), which is
    # ABI-stable across Node majors, so one build serves the whole Node
    # 20/22/24 matrix.
    name: Build native module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        working-directory: packages/ts
        run: pnpm install

      - name: Build native module + stage platform
        working-directory: packages/ts
        run: pnpm build

      - name: Upload native build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ts-native-build
          path: |
            packages/ts/dirsql.node
            packages/ts/index.d.ts
            packages/ts/dist
            packages/ts/build
          retention-days: 1

  unit:
    name: Unit tests (Node ${{ matrix.node }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["24"]
    steps:
      - uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        working-directory: packages/ts
        run: pnpm install

      - name: Download native build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ts-native-build
          path: packages/ts

      # Invoke vitest directly (not the `pnpm test:unit` wireit script):
      # wireit's `test:unit` task depends on the `napi:build` task, and
      # calling through wireit would re-run/re-verify that build instead of
      # trusting the artifact placed above.
      - name: Run unit tests
        working-directory: packages/ts
        run: pnpm exec vitest run --dir src

  integration:
    # Hermetic tier (#289): SDK public API with the native core mocked
    # (`vi.mock`) and no filesystem access — no Rust toolchain or napi build
    # needed.
    name: Integration tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["24"]
    steps:
      - uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        working-directory: packages/ts
        run: pnpm install

      - name: Run integration tests
        working-directory: packages/ts
        run: pnpm test:integration

  binding:
    # Binding tier (#289): the SDK public API against the real napi core and
    # a real filesystem — proves the SDK↔core marshaling that the hermetic
    # integration tier mocks out.
    #
    # Keeps its own Rust toolchain + rust-cache (unlike unit/distcheck below):
    # tests/binding/*.test.ts shell out to `cargo` directly at test-run time
    # to compile ad hoc fixture extension crates (packages/rust/tests/fixtures)
    # — that's independent of the shared napi addon build and still needs a
    # toolchain on this runner.
    name: Binding tests (Node ${{ matrix.node }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["24"]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        working-directory: packages/ts
        run: pnpm install

      - name: Download native build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ts-native-build
          path: packages/ts

      # See the `unit` job comment above for why this bypasses wireit.
      - name: Run binding tests
        working-directory: packages/ts
        run: pnpm exec vitest run --dir tests/integration/binding --passWithNoTests

  # Unit coverage now runs in the reusable testing-conventions workflow
  # (conventions.yml, `typescript-sdk` gates: unit-coverage) after upstream
  # #284 taught the coverage suite job to install/build from the derived
  # package root. The bespoke coverage job that lived here is retired (#412).

  distcheck:
    # Functional publishability gate: build the real binary + napi addon,
    # pack the main `dirsql` package and the host's `@dirsql/cli-<slug>`
    # sub-package the way the release pipeline would, `npm install` both
    # into a fresh dir, and run `node_modules/.bin/dirsql --version`. Red
    # here means the npm release is broken and must not go out. This is the
    # install-and-run check the `packaging` gate does NOT do (that gate only
    # asserts no test files ship in the artifact). No mocks. The flow lives
    # in the internals/distcheck package (#520); this job invokes its
    # `dirsql-distcheck node` entry point (which drives npm/pnpm from Python).
    name: Packaging distcheck (ts)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        working-directory: packages/ts
        run: pnpm install

      - name: Download native build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ts-native-build
          path: packages/ts

      - name: Run packaging distcheck (build -> pack -> install -> run)
        run: uv run --project internals/distcheck dirsql-distcheck node
