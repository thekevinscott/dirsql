name: Plugins Test

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - '.github/workflows/plugins-test.yml'
  pull_request:
    paths:
      - 'plugins/**'
      - '.github/workflows/plugins-test.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  embeddings-integration:
    # conventions.yml runs the plugin's colocated unit tier and checks its e2e
    # attestation, but nothing ran tests/integration/ — the tier that proves
    # the worker protocol over real pipes and each `[project.scripts]` target
    # is importable and runnable as declared.
    name: dirsql-plugin-embeddings integration tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Low leg = the plugin's `requires-python` floor; see python-test.yml.
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run integration tests
        run: uv run --with-editable . python -m pytest tests/integration/ -x -q --tb=short
        working-directory: plugins/dirsql-plugin-embeddings
