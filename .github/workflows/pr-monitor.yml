name: PR Monitor

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  checks: read

jobs:
  monitor:
    name: 'CI Gate'
    runs-on: ubuntu-latest
    steps:
      - uses: thekevinscott/pr-monitor@v1
        with:
          job-name: 'CI Gate'
