name: PR Monitor

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  monitor:
    name: 'CI Gate'
    runs-on: ubuntu-latest
    steps:
      - uses: thekevinscott/pr-monitor@v1
        with:
          # Path filtering (#834) means a PR can legitimately trigger zero
          # checks; zero runs after pre-sleep is a pass, not a wait (#943).
          minimum-checks: 0
          # With minimum-checks at 0, pre-sleep is the only guard against
          # polling before other workflows register. Observed dispatch fan-out
          # is ~2s across all nine workflows (#946); 30s is ~15x margin.
          pre-sleep: 30
          # Double the longest run observed in the accessible Actions history
          # (Release Precheck, 22m21s, under multi-PR contention on 2026-08-12
          # — which also outran the old gate's 20-minute timeout). Post-#834
          # fan-out completes in ~3 minutes, so a firing means a hung job.
          timeout: 45
