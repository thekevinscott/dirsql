name: Conventions

on: [pull_request]

permissions:
  contents: read

# Adopt the testing-conventions reusable workflow (@v0). This runs the static
# gates (colocated-test, unit-lint, integration-lint) PLUS the suite-executing
# `mutation` (TypeScript, Rust) and `unit-coverage` (TypeScript, python) gates.
# The upstream monorepo primitive makes the reusable workflow build the native
# artifact from the derived package root itself (#277 derives the root from
# `path`; #279 wired the mutation job; #284 wired the coverage job — python via
# python_env=uv `uv sync`, ts via build_command `pnpm build`), so the bespoke
# ts-mutation.yml / rust-mutation.yml (#417) and the python/ts coverage jobs
# (#412) are retired.
#
# Still bespoke (each blocked on a distinct upstream fix): `packaging` (#413),
# `e2e-verify` (#418, needs #294's freshness-walk scope), python `mutation`
# (cosmic-ray env), and rust `unit-coverage` (needs the nightly toolchain for
# `--branch`).
#
# One call per package (the intended monorepo pattern), scoped per tier because
# the tool scans `path` recursively with no exclusions:
#   - unit-tier gates (colocated-test, unit-lint, + mutation for ts/rust) at each
#     SDK's SOURCE dir
#   - integration-lint at each SDK's integration-test dir (python/ts) or the
#     crate root (rust, which scans tests/ itself)
#
# The `gates` allowlists below were set empirically: a run turned each gate on
# and the arbiter reported the reds. Every gate listed here is GREEN and
# enforced. (The one initial red — rust `unit-lint`, 17 real isolation
# violations the old mis-scoped bespoke check missed — was fixed in #395 and the
# gate re-enabled.) No gate is excluded to dodge enforcement: a red is filed and
# fixed, not hidden.
jobs:
  python-unit:
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@v0
    with:
      languages: '["python"]'
      path: packages/python/dirsql
      config: testing-conventions.toml
      base: ${{ github.event.pull_request.base.sha || 'origin/main' }}
      # `unit-coverage` runs here after upstream #284: the coverage job installs
      # from the derived package root and runs `uv sync` when python_env=uv. Our
      # pyproject.toml has a [project] table + maturin backend, so python_env
      # resolves to uv (`uv sync` builds maturin into the suite venv) and
      # provision_rust fires — NO build_command / rust_toolchain needed. Dev deps
      # live in a PEP 735 [dependency-groups].dev so plain `uv sync` installs the
      # pytest plugins the suite needs. Retires python-test.yml's coverage job (#412).
      # PROBE (#413): + packaging. #286 (packaging discovery) shipped before the
      # current @v0, so the reusable packaging gate should find + build the wheel
      # from the derived root. Bespoke packaging.yml KEPT (probe only adds).
      gates: '["colocated-test", "unit-lint", "unit-coverage", "packaging"]'

  python-integration:
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@v0
    with:
      languages: '["python"]'
      path: packages/python/tests/integration
      config: testing-conventions.toml
      base: ${{ github.event.pull_request.base.sha || 'origin/main' }}
      gates: '["integration-lint"]'

  typescript-unit:
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@v0
    with:
      languages: '["typescript"]'
      path: packages/ts/src
      config: testing-conventions.toml
      base: ${{ github.event.pull_request.base.sha || 'origin/main' }}
      # `mutation` reruns the unit suite per mutant, which loads the native
      # `dirsql.node`; #279 runs build_command from the derived root
      # (packages/ts), so `pnpm build` compiles the napi core there and
      # rust_toolchain provisions its cargo. Retires ts-mutation.yml (#417).
      # `mutation` + `unit-coverage` both run here. TS keeps rust_toolchain +
      # `pnpm build` — both suites load the napi `dirsql.node`, so it's built
      # explicitly from the derived root. Retires ts-test.yml's coverage job (#412).
      # PROBE (#413): + packaging.
      gates: '["colocated-test", "unit-lint", "mutation", "unit-coverage", "packaging"]'
      rust_toolchain: true
      build_command: pnpm build

  typescript-integration:
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@v0
    with:
      languages: '["typescript"]'
      path: packages/ts/tests/integration
      config: testing-conventions.toml
      base: ${{ github.event.pull_request.base.sha || 'origin/main' }}
      gates: '["integration-lint"]'

  rust:
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@v0
    with:
      languages: '["rust"]'
      path: packages/rust
      config: testing-conventions.toml
      base: ${{ github.event.pull_request.base.sha || 'origin/main' }}
      # colocated-test now runs for rust: upstream #274/#275 made the detector
      # fan the presence check over rust (co-change stays python/ts). This retires
      # the bespoke `colocated` job that rust-test.yml carried as a stopgap (#411).
      # `mutation` (cargo-mutants) needs no build_command — the CLI self-provisions
      # the engine, which builds and reruns the crate's own tests; #279 installs it
      # from the derived root. No nightly (unlike coverage's --branch). Retires
      # rust-mutation.yml (#417).
      # PROBE (#413): + packaging (crate hygiene).
      gates: '["colocated-test", "unit-lint", "integration-lint", "mutation", "packaging"]'
