name: Conventions

on: [pull_request]

permissions:
  contents: read

# Adopt the testing-conventions reusable workflow (@v0) for the STATIC gates
# only — the documented split-setup pattern (docs/guide/ci.md "Scoping serves
# split setups"): the suite-executing gates (coverage/mutation) and the
# repo-root-scoped ones (packaging/e2e-verify) stay in our own build-capable
# workflows, tracked for retirement in #393.
#
# One call per package (the intended monorepo pattern), scoped per tier because
# the tool scans `path` recursively with no exclusions:
#   - unit-tier static gates (colocated-test, unit-lint) at each SDK's SOURCE dir
#   - integration-lint at each SDK's integration-test dir (python/ts) or the
#     crate root (rust, which scans tests/ itself)
#
# The `gates` allowlists below were set empirically: a first run turned every
# static gate on (nothing excluded) and the arbiter reported the reds. Every
# gate listed here came back GREEN. The one red — rust `unit-lint` (17 real
# isolation violations the old mis-scoped bespoke check missed) — is turned OFF
# here and tracked in #395; re-add it once fixed. No gate is excluded to dodge
# enforcement: a red is filed, not hidden.
jobs:
  python-unit:
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@v0
    with:
      languages: '["python"]'
      path: packages/python/dirsql
      config: testing-conventions.toml
      base: ${{ github.event.pull_request.base.sha || 'origin/main' }}
      # unit-coverage added (#393 migration): the reusable suite-executing job
      # provisions stable Rust + cache (rust_toolchain) and runs build_command
      # from the repo root before the coverage suite, so it can build the PyO3
      # native ext the unit suite imports. The bespoke coverage job in
      # python-test.yml stays until this proves green in CI, then retires.
      gates: '["colocated-test", "unit-lint", "unit-coverage"]'
      rust_toolchain: true
      build_command: cd packages/python && uv run maturin develop

  python-integration:
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@v0
    with:
      languages: '["python"]'
      path: packages/python/tests/integration
      config: testing-conventions.toml
      base: ${{ github.event.pull_request.base.sha || 'origin/main' }}
      gates: '["integration-lint"]'

  typescript-unit:
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@v0
    with:
      languages: '["typescript"]'
      path: packages/ts/src
      config: testing-conventions.toml
      base: ${{ github.event.pull_request.base.sha || 'origin/main' }}
      # unit-coverage added (#393 migration): build_command builds the napi
      # native module the vitest suite loads; rust_toolchain provisions the Rust
      # the napi build shells out to. Bespoke ts-test.yml coverage stays until
      # this proves green, then retires.
      gates: '["colocated-test", "unit-lint", "unit-coverage"]'
      rust_toolchain: true
      build_command: cd packages/ts && pnpm build

  typescript-integration:
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@v0
    with:
      languages: '["typescript"]'
      path: packages/ts/tests/integration
      config: testing-conventions.toml
      base: ${{ github.event.pull_request.base.sha || 'origin/main' }}
      gates: '["integration-lint"]'

  rust:
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@v0
    with:
      languages: '["rust"]'
      path: packages/rust
      config: testing-conventions.toml
      base: ${{ github.event.pull_request.base.sha || 'origin/main' }}
      # unit-lint is OFF pending #395 (17 real isolation violations). colocated-test
      # is absent because the reusable workflow's detector excludes rust from it by
      # design (inline #[cfg(test)] units can't go stale, so there's no co-change
      # dimension) — it silently no-ops here. Rust colocation is enforced bespoke in
      # rust-test.yml's `colocated` job until upstream offers it (tracked in #393).
      gates: '["integration-lint"]'
