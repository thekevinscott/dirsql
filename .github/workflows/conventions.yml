name: Conventions

on: [pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Adopt the testing-conventions reusable workflow (@v0). This runs the static
# gates (colocated-test, unit-lint, integration-lint) PLUS the suite-executing
# `mutation` (all three SDKs), `unit-coverage` (TypeScript, python), and
# `e2e-verify` (TypeScript, python) gates.
# The upstream monorepo primitive makes the reusable workflow build the native
# artifact from the derived package root itself (#277 derives the root from
# `path`; #279 wired the mutation job; #284 wired the coverage job — python via
# python_env=uv `uv sync`, ts via napi auto-provisioning after #289 removed the
# build_command input), so the bespoke ts-mutation.yml / rust-mutation.yml (#417),
# python-mutation.yml (#426), the python/ts coverage jobs (#412), and the whole
# e2e-attestation.yml (#418, via the `--base` squash-fix) are retired.
#
# The #337 shared-core e2e-freshness case (a core change stales both binding
# attestations but lives outside either binding's `--scope`) is solved by
# `testing-conventions.toml`'s `[e2e].extra_scope = ["packages/rust/src"]`
# (upstream #333: `e2e verify --extra-scope`, wired through `detect`) — pure
# config, the e2e-verify gate below enforces it. No bespoke gate. No `exclude`
# carve-out for `src/cli`/`src/bin`: the language packages ship the compiled
# `dirsql` binary and their e2e suites spawn it, so CLI changes stale the
# attestations like any other core change.
#
# `packaging` (#413) runs whole-hog for all three SDKs, zero-config (just
# "packaging" in `gates`, no build job). Rust adopted it via upstream #360/#362,
# which fixed workspace-member support (packages/rust is a Cargo workspace
# member, so `cargo package` wrote to the workspace root's target/package until
# the fix redirected it via `--target-dir target`). The bespoke packaging.yml is
# deleted -- this gate is the sole packaging enforcement.
#
# Still bespoke (for now): rust `unit-coverage` (bespoke by design in
# rust-test.yml — a `packages/rust` `rust-toolchain.toml` for `--branch` nightly
# breaks release cross-compile; #412 closed).
#
# One call per package (the intended monorepo pattern), scoped per tier because
# the tool scans `path` recursively with no exclusions:
#   - unit-tier gates (colocated-test, unit-lint, + mutation for ts/rust) at each
#     SDK's SOURCE dir
#   - integration-lint at each SDK's integration-test dir (python/ts) or the
#     crate root (rust, which scans tests/ itself)
#
# The `gates` allowlists below were set empirically: a run turned each gate on
# and the arbiter reported the reds. Every gate listed here is GREEN and
# enforced. (The one initial red — rust `unit-lint`, 17 real isolation
# violations the old mis-scoped bespoke check missed — was fixed in #395 and the
# gate re-enabled.) No gate is excluded to dodge enforcement: a red is filed and
# fixed, not hidden.
jobs:
  python-unit:
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@v0
    with:
      languages: '["python"]'
      path: packages/python/dirsql
      config: testing-conventions.toml
      base: ${{ github.event.pull_request.base.sha || 'origin/main' }}
      # `unit-coverage` runs here after upstream #284: the coverage job installs
      # from the derived package root and runs `uv sync` when python_env=uv. Our
      # pyproject.toml has a [project] table + maturin backend, so python_env
      # resolves to uv (`uv sync` builds maturin into the suite venv) and
      # provision_rust fires — NO build_command / rust_toolchain needed. Dev deps
      # live in a PEP 735 [dependency-groups].dev so plain `uv sync` installs the
      # pytest plugins the suite needs. Retires python-test.yml's coverage job (#412).
      # `mutation` runs here too: the testing-conventions wheel now bundles the
      # cosmic-ray adapter as a runtime dep, so the reusable mutation job resolves
      # the engine from the same `uv sync` env — no separate install. Retires
      # python-mutation.yml (#426).
      # `e2e-verify` (#418): head.sha checkout (#293) + `--scope packages/python/dirsql`
      # (#294) + `--base` diff-scoping (squash-fix) — freshness is measured over
      # base..HEAD's scoped-source diff, so a PR that doesn't touch the SDK source
      # has nothing to verify (no stale-on-main false red). This retired the
      # bespoke e2e-attestation.yml entirely. The #337 shared-core case (a core
      # change stales both binding attestations though it lives outside this
      # `--scope`) is covered by `[e2e].extra_scope = ["packages/rust/src"]` in
      # testing-conventions.toml (upstream #333 `--extra-scope`, wired via detect):
      # any packages/rust/src change (cli included) stales this attestation too.
      gates: '["colocated-test", "unit-lint", "unit-coverage", "mutation", "e2e-verify", "packaging"]'

  python-integration:
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@v0
    with:
      languages: '["python"]'
      path: packages/python/tests/integration
      config: testing-conventions.toml
      base: ${{ github.event.pull_request.base.sha || 'origin/main' }}
      gates: '["integration-lint"]'

  typescript-unit:
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@v0
    with:
      languages: '["typescript"]'
      path: packages/ts/src
      config: testing-conventions.toml
      base: ${{ github.event.pull_request.base.sha || 'origin/main' }}
      # `mutation` + `unit-coverage` both run here; both suites load the native
      # napi `dirsql.node`. #289 removed the `build_command` workflow input (passing
      # it now startup-fails the whole workflow) and there is no `[typescript]`
      # build_command config key — so the napi build is AUTO-PROVISIONED because
      # `packages/ts/napi` declares a napi build. `rust_toolchain: true` (still a
      # valid input) supplies cargo for that build.
      # `e2e-verify` (#418): `--scope packages/ts/src` + `--base` diff-scoping.
      gates: '["colocated-test", "unit-lint", "mutation", "unit-coverage", "e2e-verify", "packaging"]'
      rust_toolchain: true

  typescript-integration:
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@v0
    with:
      languages: '["typescript"]'
      path: packages/ts/tests/integration
      config: testing-conventions.toml
      base: ${{ github.event.pull_request.base.sha || 'origin/main' }}
      gates: '["integration-lint"]'

  rust:
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@v0
    with:
      languages: '["rust"]'
      path: packages/rust
      config: testing-conventions.toml
      base: ${{ github.event.pull_request.base.sha || 'origin/main' }}
      # colocated-test now runs for rust: upstream #274/#275 made the detector
      # fan the presence check over rust (co-change stays python/ts). This retires
      # the bespoke `colocated` job that rust-test.yml carried as a stopgap (#411).
      # `mutation` (cargo-mutants) needs no build_command — the CLI self-provisions
      # the engine, which builds and reruns the crate's own tests; #279 installs it
      # from the derived root. No nightly (unlike coverage's --branch). Retires
      # rust-mutation.yml (#417).
      #
      # `packaging` works for this workspace member via upstream #360/#362:
      # membership is detected from an ancestor Cargo.toml `[workspace]` table and
      # the build is redirected via `--target-dir target` so the .crate lands
      # under the member's own target/package where the gate scans. Zero-config,
      # no extra input (#413).
      gates: '["colocated-test", "unit-lint", "integration-lint", "mutation", "packaging"]'

  # The two native BINDING crates (#405) hold real marshaling logic but sat
  # outside every gate — the `rust` call above scans only `packages/rust` (the
  # core). Bring each binding crate under colocated-test + unit-lint at its own
  # crate root. Their pure conversion logic is unit-tested inline; the
  # runtime-coupled parts (napi::sys getters / FnRef; pyo3 GIL conversions) stay
  # covered by the binding tier (#233). No mutation/coverage here: those run the
  # suite and would need the napi/pyo3 build; the static presence+isolation gates
  # are what #405 is about. No exemption — the crux (does unit-lint tolerate a
  # test constructing first-party `Value`/`RowEvent` via `super::*`?) resolved
  # green in probing.
  rust-napi-binding:
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@v0
    with:
      languages: '["rust"]'
      path: packages/ts/napi
      config: testing-conventions.toml
      base: ${{ github.event.pull_request.base.sha || 'origin/main' }}
      gates: '["colocated-test", "unit-lint"]'

  rust-python-binding:
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@v0
    with:
      languages: '["rust"]'
      path: packages/python
      config: testing-conventions.toml
      base: ${{ github.event.pull_request.base.sha || 'origin/main' }}
      gates: '["colocated-test", "unit-lint"]'

  # internals/checks (#494/#503, integration+e2e tiers #509): the repo-tooling
  # checks package. `path` is the inner importable dir (internals/checks/src),
  # not the package root, matching every other call above. `e2e-verify`
  # measures freshness of internals/checks/e2e-attestation.json against this
  # scoped diff, mirroring the python-unit / typescript-unit wiring above.
  #
  # `integration-lint` runs in THIS SAME call rather than a separate job/path:
  # testing-conventions' derived-suite-tiers behavior (thekevinscott/
  # testing-conventions#417 -- docs/monorepo.md "Everything derives from the
  # package" / "The test tiers") resolves the integration suite to
  # `<package root>/tests/integration/` (here, internals/checks/tests/
  # integration) from the derived package root, independent of `path` -- so one
  # call runs every tier, exactly like the simple per-package example in that
  # doc. `@v0` is a moving tag (fixes/new checks land with no version bump on
  # our side), so this is written for the post-#417 behavior; if CI runs before
  # #417 lands upstream, temporarily split `integration-lint` back into its own
  # call scoped at `path: internals/checks/tests/integration` (the pattern
  # python-integration / typescript-integration below still use, pending the
  # same upstream landing).
  internals-checks:
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@v0
    with:
      languages: '["python"]'
      path: internals/checks/src
      base: ${{ github.event.pull_request.base.sha || 'origin/main' }}
      gates: '["colocated-test", "unit-lint", "integration-lint", "unit-coverage", "mutation", "e2e-verify"]'
