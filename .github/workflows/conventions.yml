name: Conventions

on: [pull_request]

permissions:
  contents: read

# Adopt the testing-conventions reusable workflow (@v0) for the STATIC gates
# only — the documented split-setup pattern (docs/guide/ci.md "Scoping serves
# split setups"): the suite-executing gates (coverage/mutation) and the
# repo-root-scoped ones (packaging/e2e-verify) stay in our own build-capable
# workflows, tracked for retirement in #393.
#
# One call per package (the intended monorepo pattern), scoped per tier because
# the tool scans `path` recursively with no exclusions:
#   - unit-tier static gates (colocated-test, unit-lint) at each SDK's SOURCE dir
#   - integration-lint at each SDK's integration-test dir (python/ts) or the
#     crate root (rust, which scans tests/ itself)
#
# The `gates` allowlists below were set empirically: a first run turned every
# static gate on (nothing excluded) and the arbiter reported the reds. Every
# gate listed here is GREEN and enforced. (The one initial red — rust `unit-lint`,
# 17 real isolation violations the old mis-scoped bespoke check missed — was
# fixed in #395 and the gate re-enabled.) No gate is excluded to dodge
# enforcement: a red is filed and fixed, not hidden.
jobs:
  python-unit:
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@v0
    with:
      languages: '["python"]'
      path: packages/python/dirsql
      config: testing-conventions.toml
      base: ${{ github.event.pull_request.base.sha || 'origin/main' }}
      # PROBE (#412): does #277 (package-root from path) + `pip install .` (the
      # maintainer's build-and-run-in-one-interpreter example) make python
      # unit-coverage work in the reusable workflow? Bespoke coverage kept.
      gates: '["colocated-test", "unit-lint", "unit-coverage"]'
      rust_toolchain: true
      build_command: cd packages/python && python -m pip install .

  python-integration:
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@v0
    with:
      languages: '["python"]'
      path: packages/python/tests/integration
      config: testing-conventions.toml
      base: ${{ github.event.pull_request.base.sha || 'origin/main' }}
      gates: '["integration-lint"]'

  typescript-unit:
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@v0
    with:
      languages: '["typescript"]'
      path: packages/ts/src
      config: testing-conventions.toml
      base: ${{ github.event.pull_request.base.sha || 'origin/main' }}
      # PROBE (#412/#417): #277 derives the package root from `path`, so the
      # suite job's `pnpm install` should now find packages/ts. Re-run of the
      # #410 failure. Bespoke coverage/mutation kept.
      gates: '["colocated-test", "unit-lint", "unit-coverage", "mutation"]'
      rust_toolchain: true
      build_command: cd packages/ts && pnpm build

  typescript-integration:
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@v0
    with:
      languages: '["typescript"]'
      path: packages/ts/tests/integration
      config: testing-conventions.toml
      base: ${{ github.event.pull_request.base.sha || 'origin/main' }}
      gates: '["integration-lint"]'

  rust:
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@v0
    with:
      languages: '["rust"]'
      path: packages/rust
      config: testing-conventions.toml
      base: ${{ github.event.pull_request.base.sha || 'origin/main' }}
      # colocated-test runs for rust (upstream #274/#275). PROBE (#417): + mutation
      # — #279 makes the mutation job install/build from the derived package root;
      # rust needs no nightly for mutation (unlike coverage's --branch). Bespoke
      # rust-mutation.yml kept.
      gates: '["colocated-test", "unit-lint", "integration-lint", "mutation"]'
