name: Conventions

on: [pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-sdk:
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@v0
    with:
      languages: '["python"]'
      path: packages/python/dirsql
      config: testing-conventions.toml
      base: ${{ github.event.pull_request.base.sha || 'origin/main' }}

  typescript-sdk:
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@v0
    with:
      languages: '["typescript"]'
      path: packages/ts/src
      config: testing-conventions.toml
      base: ${{ github.event.pull_request.base.sha || 'origin/main' }}
      rust_toolchain: true

  rust:
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@v0
    with:
      languages: '["rust"]'
      path: packages/rust
      config: testing-conventions.toml
      base: ${{ github.event.pull_request.base.sha || 'origin/main' }}
      gates: '["colocated-test", "unit-lint", "integration-lint", "mutation", "packaging"]'

  rust-napi-binding:
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@v0
    with:
      languages: '["rust"]'
      path: packages/ts/napi
      config: testing-conventions.toml
      base: ${{ github.event.pull_request.base.sha || 'origin/main' }}
      gates: '["colocated-test", "unit-lint"]'

  rust-python-binding:
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@v0
    with:
      languages: '["rust"]'
      path: packages/python
      config: testing-conventions.toml
      base: ${{ github.event.pull_request.base.sha || 'origin/main' }}
      gates: '["colocated-test", "unit-lint"]'

  internals-checks:
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@v0
    with:
      languages: '["python"]'
      path: internals/checks/src
      config: internals/checks/testing-conventions.toml
      base: ${{ github.event.pull_request.base.sha || 'origin/main' }}
      gates: '["colocated-test", "unit-lint", "integration-lint", "unit-coverage", "mutation", "e2e-verify"]'

  internals-distcheck:
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@v0
    with:
      languages: '["python"]'
      path: internals/distcheck/src
      base: ${{ github.event.pull_request.base.sha || 'origin/main' }}
      gates: '["colocated-test", "unit-lint", "integration-lint", "unit-coverage", "mutation"]'
