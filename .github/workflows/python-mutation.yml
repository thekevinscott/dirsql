name: Python Mutation

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# PR-only and diff-scoped. `unit mutation` is fed `--base` so it mutates only
# the lines this PR added/modified (cosmic-ray `--in-diff`); there is no base
# to diff against on a push to `main`, so we never run it there. Triggered only
# when the Python unit-suite source changes -- a diff touching no
# `packages/python/dirsql` line has nothing to mutate.
on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/python/dirsql/**/*.py'
      - 'testing-conventions.toml'
      - '.github/workflows/python-mutation.yml'

permissions:
  contents: read

jobs:
  mutation:
    name: unit mutation (cosmic-ray)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so `--base <base.sha>...HEAD` can diff the PR's lines.
          fetch-depth: 0

      # Rust builds the `_dirsql` extension the unit suite imports.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      # Node runs the testing-conventions CLI via `npx` (unpinned -> latest).
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: uv sync --extra dev
        working-directory: packages/python

      # The gate reruns the real unit suite per mutant, which imports the native
      # `_dirsql`. The testing-conventions reusable workflow has no build step
      # (epic #231), so we build inside our own job.
      - name: Build Rust extension
        run: uv run maturin develop
        working-directory: packages/python

      # cosmic-ray is the only engine the CLI does not self-provision, so we
      # install it -- into the same venv as the built extension, so the baseline
      # (`python3 -m pytest`) the CLI shells out to resolves `_dirsql`, `dirsql`,
      # pytest and cosmic-ray from one interpreter (guaranteed by activating the
      # venv before the run below). The testing-conventions pip package ships
      # the cosmic-ray adapter the CLI spawns
      # (`python3 -m testing_conventions.mutation.main`), so it must resolve
      # from that same interpreter too.
      - name: Install cosmic-ray (mutation engine) and the adapter
        run: uv pip install cosmic-ray testing-conventions
        working-directory: packages/python

      - name: Mutation on the lines changed vs base
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        working-directory: packages/python
        run: |
          source .venv/bin/activate
          npx -y testing-conventions unit mutation --language python --base "$BASE" dirsql
