name: Bootstrap npm platforms

# One-time bootstrap. Publishes a stub `0.0.0-bootstrap` of every
# per-platform npm sub-package (`@dirsql/lib-*`, `@dirsql/cli-*`) using
# a long-lived `NPM_TOKEN`, so that the npm trusted-publisher feature
# can be enabled on each (TP requires the package to exist).
#
# After this workflow succeeds:
#   1. For each package below, register a trusted publisher at
#      https://www.npmjs.com/package/<name>/access pointing at
#      `release.yml` + environment `release`.
#   2. Delete the `NPM_TOKEN` repo secret.
#   3. Delete this workflow file.
#
# Putitoutthere v0.2 explicitly does NOT pass long-lived tokens through
# the reusable workflow, so this bootstrap step is a separate,
# manually-dispatched workflow rather than a one-time switch in the
# release path.

on:
  workflow_dispatch:
  # TEMP — REVERT BEFORE MERGING. Auto-runs on PR push so the bootstrap
  # stubs get seeded without needing manual dispatch.
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish 0.0.0-bootstrap stubs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { mkdtempSync, rmSync, writeFileSync } from "node:fs";
          import { tmpdir } from "node:os";
          import { join } from "node:path";
          import { spawnSync } from "node:child_process";

          // [name, npm os, npm cpu, npm libc | null]
          const packages = [
            ["@dirsql/lib-linux-x64-gnu",   "linux",  "x64",   "glibc"],
            ["@dirsql/lib-linux-arm64-gnu", "linux",  "arm64", "glibc"],
            ["@dirsql/lib-darwin-x64",      "darwin", "x64",   null],
            ["@dirsql/lib-darwin-arm64",    "darwin", "arm64", null],
            ["@dirsql/lib-win32-x64-msvc",  "win32",  "x64",   null],
            ["@dirsql/cli-linux-x64-gnu",   "linux",  "x64",   "glibc"],
            ["@dirsql/cli-linux-arm64-gnu", "linux",  "arm64", "glibc"],
            ["@dirsql/cli-darwin-x64",      "darwin", "x64",   null],
            ["@dirsql/cli-darwin-arm64",    "darwin", "arm64", null],
            ["@dirsql/cli-win32-x64-msvc",  "win32",  "x64",   null],
          ];

          const README = [
            "# Bootstrap stub",
            "",
            "This is a placeholder version published only so the npm trusted-publisher",
            "feature can be enabled on the package. Do not install.",
            "",
            "See [`dirsql`](https://www.npmjs.com/package/dirsql) for the real package.",
            "",
          ].join("\n");

          for (const [name, os, cpu, libc] of packages) {
            console.log(`::group::${name}`);

            // Idempotency: skip when the bootstrap version already exists.
            const view = spawnSync("npm", ["view", `${name}@0.0.0-bootstrap`, "version"], {
              stdio: ["ignore", "pipe", "pipe"],
            });
            if (view.status === 0) {
              console.log(`${name}@0.0.0-bootstrap already on npm; skipping.`);
              console.log("::endgroup::");
              continue;
            }

            const tmp = mkdtempSync(join(tmpdir(), "bootstrap-"));
            const pkg = {
              name,
              version: "0.0.0-bootstrap",
              description: "Bootstrap stub for OIDC trusted-publisher setup. See https://www.npmjs.com/package/dirsql.",
              license: "MIT",
              repository: "https://github.com/thekevinscott/dirsql",
              os: [os],
              cpu: [cpu],
              ...(libc ? { libc: [libc] } : {}),
            };
            writeFileSync(join(tmp, "package.json"), JSON.stringify(pkg, null, 2) + "\n");
            writeFileSync(join(tmp, "README.md"), README);

            const pub = spawnSync("npm", ["publish", "--access=public"], {
              cwd: tmp,
              stdio: "inherit",
            });
            rmSync(tmp, { recursive: true, force: true });
            if (pub.status !== 0) {
              console.error(`::endgroup::`);
              process.exit(pub.status ?? 1);
            }
            console.log("::endgroup::");
          }
          NODE
