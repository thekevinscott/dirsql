name: Bootstrap npm platforms

# One-time bootstrap. Publishes a stub `0.0.0-bootstrap` of every
# per-platform npm sub-package (`@dirsql/lib-*`, `@dirsql/cli-*`) using
# a long-lived `NPM_TOKEN`, so that the npm trusted-publisher feature
# can be enabled on each (TP requires the package to exist).
#
# After this workflow succeeds:
#   1. For each package below, register a trusted publisher at
#      https://www.npmjs.com/package/<name>/access pointing at
#      `release.yml` + environment `release`.
#   2. Delete the `NPM_TOKEN` repo secret.
#   3. Delete this workflow file.
#
# Putitoutthere v0.2 explicitly does NOT pass long-lived tokens through
# the reusable workflow, so this bootstrap step is a separate,
# manually-dispatched workflow rather than a one-time switch in the
# release path.

on:
  workflow_dispatch:
  # TEMP — REVERT BEFORE MERGING. Auto-runs on PR push so the bootstrap
  # stubs get seeded without needing manual dispatch.
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    # NPM_TOKEN may have been added as an environment-scoped secret on
    # the `release` environment (alongside the OIDC trusted-publisher
    # config). Declaring the environment here makes both repo secrets
    # AND `release`-scoped secrets visible to this job.
    environment: release
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify NPM_TOKEN is set
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN repo secret is empty or missing." >&2
            echo "## :x: NPM_TOKEN missing" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The \`NPM_TOKEN\` repo secret is empty or not exposed to this workflow run." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Note: \`pull_request\` triggers from forks do not receive secrets. This branch is on the same repo, so secrets should be available — but if the secret was added after the PR was opened, GitHub Actions may need a fresh push to surface it." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # Confirm npm can authenticate with the token before we try
          # to publish. `npm whoami` returns the username on success.
          if ! who=$(npm whoami 2>&1); then
            echo "::error::npm whoami failed; NPM_TOKEN is invalid or expired." >&2
            {
              echo "## :x: NPM_TOKEN authentication failed"
              echo ""
              echo "\`npm whoami\` returned non-zero. The token may be expired, scoped wrong, or 2FA-protected (which CI cannot satisfy)."
              echo ""
              echo "**npm output:**"
              echo '```'
              echo "$who"
              echo '```'
              echo ""
              echo "**To fix:** create a new **Granular Access Token** at <https://www.npmjs.com/settings/~/tokens/granular-access-token-create> with:"
              echo ""
              echo "- **Permissions:** \`Read and write\`"
              echo "- **Scopes:** the \`@dirsql\` org/scope (and the \`dirsql\` package itself)"
              echo "- **Expiration:** anything (will be deleted after bootstrap)"
              echo ""
              echo "Then update the \`NPM_TOKEN\` repo secret and re-run this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Authenticated to npm as: $who"
          {
            echo "## :information_source: npm authentication context"
            echo ""
            echo "**\`npm whoami\`:** \`$who\`"
            echo ""
            echo "**\`npm org ls @dirsql\` output** (token owner's role in the @dirsql org):"
            echo '```'
            npm org ls @dirsql 2>&1 || echo "(failed — token owner may not be a member of the @dirsql org)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish 0.0.0-bootstrap stubs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { mkdtempSync, rmSync, writeFileSync, appendFileSync } from "node:fs";
          import { tmpdir } from "node:os";
          import { join } from "node:path";
          import { spawnSync } from "node:child_process";

          const summary = process.env.GITHUB_STEP_SUMMARY;
          const log = (s) => { if (summary) appendFileSync(summary, s + "\n"); };

          // [name, npm os, npm cpu, npm libc | null]
          const packages = [
            ["@dirsql/lib-linux-x64-gnu",   "linux",  "x64",   "glibc"],
            ["@dirsql/lib-linux-arm64-gnu", "linux",  "arm64", "glibc"],
            ["@dirsql/lib-darwin-x64",      "darwin", "x64",   null],
            ["@dirsql/lib-darwin-arm64",    "darwin", "arm64", null],
            ["@dirsql/lib-win32-x64-msvc",  "win32",  "x64",   null],
            ["@dirsql/cli-linux-x64-gnu",   "linux",  "x64",   "glibc"],
            ["@dirsql/cli-linux-arm64-gnu", "linux",  "arm64", "glibc"],
            ["@dirsql/cli-darwin-x64",      "darwin", "x64",   null],
            ["@dirsql/cli-darwin-arm64",    "darwin", "arm64", null],
            ["@dirsql/cli-win32-x64-msvc",  "win32",  "x64",   null],
          ];

          const README = [
            "# Bootstrap stub",
            "",
            "This is a placeholder version published only so the npm trusted-publisher",
            "feature can be enabled on the package. Do not install.",
            "",
            "See [`dirsql`](https://www.npmjs.com/package/dirsql) for the real package.",
            "",
          ].join("\n");

          for (const [name, os, cpu, libc] of packages) {
            console.log(`::group::${name}`);

            // Idempotency: skip when the bootstrap version already exists.
            const view = spawnSync("npm", ["view", `${name}@0.0.0-bootstrap`, "version"], {
              stdio: ["ignore", "pipe", "pipe"],
            });
            if (view.status === 0) {
              console.log(`${name}@0.0.0-bootstrap already on npm; skipping.`);
              console.log("::endgroup::");
              continue;
            }

            const tmp = mkdtempSync(join(tmpdir(), "bootstrap-"));
            const pkg = {
              name,
              version: "0.0.0-bootstrap",
              description: "Bootstrap stub for OIDC trusted-publisher setup. See https://www.npmjs.com/package/dirsql.",
              license: "MIT",
              repository: {
                type: "git",
                url: "git+https://github.com/thekevinscott/dirsql.git",
              },
              os: [os],
              cpu: [cpu],
              ...(libc ? { libc: [libc] } : {}),
            };
            writeFileSync(join(tmp, "package.json"), JSON.stringify(pkg, null, 2) + "\n");
            writeFileSync(join(tmp, "README.md"), README);

            const pub = spawnSync("npm", ["publish", "--access=public", "--tag=bootstrap"], {
              cwd: tmp,
              stdio: ["ignore", "pipe", "pipe"],
            });
            const stdout = pub.stdout?.toString() ?? "";
            const stderr = pub.stderr?.toString() ?? "";
            process.stdout.write(stdout);
            process.stderr.write(stderr);
            rmSync(tmp, { recursive: true, force: true });
            if (pub.status !== 0) {
              log(`### :x: \`${name}\` publish failed (exit ${pub.status})`);
              log("");
              log("**stderr:**");
              log("```");
              log(stderr.trim() || "(empty)");
              log("```");
              log("");
              log("**stdout:**");
              log("```");
              log(stdout.trim() || "(empty)");
              log("```");
              console.error(`::endgroup::`);
              process.exit(pub.status ?? 1);
            }
            log(`- :white_check_mark: \`${name}\` published`);
            console.log("::endgroup::");
          }
          NODE
