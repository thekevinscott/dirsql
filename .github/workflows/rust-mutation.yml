name: Rust Mutation

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# PR-only and diff-scoped (see python-mutation.yml for the rationale). Triggered
# only when the Rust core source changes; a diff touching no
# `packages/rust/src` line has nothing to mutate.
on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/rust/src/**/*.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust-mutation.yml'

permissions:
  contents: read

jobs:
  mutation:
    name: unit mutation (cargo-mutants)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so `--base <base.sha>...HEAD` can diff the PR's lines.
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # cargo-mutants is the engine; the CLI can self-provision it, but a
      # prebuilt binary via the install-action is faster than an on-demand
      # `cargo install`, and needs no separate native-build step (cargo-mutants
      # builds and reruns the crate's tests itself).
      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      # Node runs the testing-conventions CLI via `npx` (unpinned -> latest).
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Mutation on the lines changed vs base
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: npx -y testing-conventions unit mutation --language rust --base "$BASE" packages/rust/src
