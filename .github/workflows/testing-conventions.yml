name: Testing Conventions

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Pinned in lockstep with CI (see AGENTS.md). Bump deliberately and re-run
  # `just test-conventions` locally before changing this.
  TESTING_CONVENTIONS_VERSION: "0.0.41"

on:
  push:
    branches: [main]
    paths:
      - 'packages/python/dirsql/**/*.py'
      - 'packages/python/tests/integration/**/*.py'
      - 'packages/ts/src/**/*.ts'
      - 'packages/ts/test/**/*.ts'
      - 'packages/rust/src/**/*.rs'
      - 'packages/rust/tests/**/*.rs'
      - 'testing-conventions.toml'
      - '.github/workflows/testing-conventions.yml'
  pull_request:
    paths:
      - 'packages/python/dirsql/**/*.py'
      - 'packages/python/tests/integration/**/*.py'
      - 'packages/ts/src/**/*.ts'
      - 'packages/ts/test/**/*.ts'
      - 'packages/rust/src/**/*.rs'
      - 'packages/rust/tests/**/*.rs'
      - 'testing-conventions.toml'
      - '.github/workflows/testing-conventions.yml'

permissions:
  contents: read

jobs:
  colocation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so the PR-only co-change check can diff against the
          # base commit.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install testing-conventions
        run: pip install "testing-conventions==${TESTING_CONVENTIONS_VERSION}"

      - name: Check colocated unit tests (presence)
        # Tree-wide presence: every source file needs a colocated unit test
        # (Rust = an inline `#[cfg(test)]` module). Exemptions (the lone
        # package barrel) live in testing-conventions.toml, read by default.
        # Aggregate so one run reports every language's violations.
        run: |
          rc=0
          testing-conventions unit colocated-test --language python packages/python/dirsql || rc=1
          testing-conventions unit colocated-test --language typescript packages/ts/src || rc=1
          testing-conventions unit colocated-test --language rust packages/rust/src || rc=1
          exit $rc

      - name: Check colocated unit tests (co-change, PR only)
        # Diff-scoped: a modified or deleted source whose colocated test did
        # not co-change fails. Python/TypeScript only -- the CLI rejects
        # `--base --language rust` (inline test modules have no sibling test
        # file to go stale).
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          rc=0
          testing-conventions unit colocated-test --language python --base "$BASE" packages/python/dirsql || rc=1
          testing-conventions unit colocated-test --language typescript --base "$BASE" packages/ts/src || rc=1
          exit $rc

      - name: Check unit-test isolation (lint)
        # Isolation: a unit test must mock every collaborator (Rust: no
        # effectful-std call out of the unit's own module). Wired for all three
        # SDKs -- the Rust core's tests were moved to the integration tier or
        # routed through a trait-injected `FileSystem` double (#233 / epic #231).
        # Waivers (none today) live in testing-conventions.toml, read by default.
        run: |
          rc=0
          testing-conventions unit lint --language python packages/python/dirsql || rc=1
          testing-conventions unit lint --language typescript packages/ts/src || rc=1
          testing-conventions unit lint --language rust packages/rust/src || rc=1
          exit $rc

      - name: Check integration-test mocking style (lint)
        # Integration lint: integration test files must use the sanctioned
        # mocking mechanism (Python: `unittest.mock`, not pytest's
        # `monkeypatch` fixture; TS: `vi.*`; Rust: trait doubles). Wired for
        # all three SDKs (#236 / epic #231). Waivers (none today) live in
        # testing-conventions.toml, read by default.
        run: |
          rc=0
          testing-conventions integration lint --language python packages/python/tests/integration || rc=1
          testing-conventions integration lint --language typescript packages/ts/test || rc=1
          testing-conventions integration lint --language rust packages/rust/tests || rc=1
          exit $rc
