name: Testing Conventions

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Pinned in lockstep with CI (see AGENTS.md). Bump deliberately and re-run
  # ./scripts/check-testing-conventions.sh locally before changing this.
  TESTING_CONVENTIONS_VERSION: "0.0.6"

on:
  push:
    branches: [main]
    paths:
      - 'packages/python/dirsql/**/*.py'
      - 'packages/ts/src/**/*.ts'
      - 'scripts/check-testing-conventions.sh'
      - '.github/workflows/testing-conventions.yml'
  pull_request:
    paths:
      - 'packages/python/dirsql/**/*.py'
      - 'packages/ts/src/**/*.ts'
      - 'scripts/check-testing-conventions.sh'
      - '.github/workflows/testing-conventions.yml'

permissions:
  contents: read

jobs:
  colocation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install testing-conventions
        run: pip install "testing-conventions==${TESTING_CONVENTIONS_VERSION}"

      - name: Check colocated unit tests
        run: ./scripts/check-testing-conventions.sh
