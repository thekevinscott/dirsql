name: Changelog Check

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Sync the checks package
        run: uv sync --project internals/checks

      # Logic (per-package path classification, per-package fragment
      # detection, skip-trailer parsing) lives in internals/checks'
      # changelog_gate check, colocated-tested at 100% coverage, per
      # AGENTS.md "CI Workflows".
      - name: Require a per-package changelog fragment for SDK code changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: uv run --project internals/checks dirsql-checks changelog-gate
