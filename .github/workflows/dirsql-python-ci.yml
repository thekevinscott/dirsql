name: dirsql Python CI

# All PR verification for the Python SDK (packages/python): lint, typecheck,
# the four test tiers, and the testing-conventions gate suites for the SDK
# and the PyO3 binding crate. Merged from python-lint.yml, python-typecheck.yml,
# python-test.yml and two conventions.yml lanes so one paths filter governs
# the whole set.
#
# packages/rust/** fans in: the core compiles into the binding, and
# [e2e].extra_scope means a core change stales this package's attestation.
# No self-path on pull_request, per the #834 stack convention.
on:
  push:
    branches: [main]
    paths:
      - 'packages/python/**'
      - 'packages/rust/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'testing-conventions.toml'
      - '.github/workflows/dirsql-python-ci.yml'
  pull_request:
    paths:
      - 'packages/python/**'
      - '!packages/python/changelog.d/**'
      - '!packages/python/migrations.d/**'
      - '!packages/python/README.md'
      - 'packages/rust/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'testing-conventions.toml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Job ids `python-sdk` / `rust-python-binding` kept from their
  # conventions.yml lanes so check-run names are unchanged.
  python-sdk:
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@v0
    with:
      languages: '["python"]'
      source: packages/python/dirsql
      config: testing-conventions.toml
      base: ${{ github.event.pull_request.base.sha || 'origin/main' }}

  rust-python-binding:
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@v0
    with:
      languages: '["rust"]'
      source: packages/python
      config: testing-conventions.toml
      base: ${{ github.event.pull_request.base.sha || 'origin/main' }}
      gates: '["colocated-test", "unit-lint"]'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install just
        uses: extractions/setup-just@v2

      # Lint/format only touch the `.py` source and never execute the
      # compiled extension, so skip installing/building the local maturin
      # project (`uv sync` would otherwise pay a full Rust build just to run
      # ruff). `uv run --no-sync` keeps the `ruff` invocations from
      # re-triggering the project install that a plain `uv run` performs
      # implicitly.
      - name: Install dependencies
        run: uv sync --no-install-project
        working-directory: packages/python

      - name: Lint
        run: uv run --no-sync ruff check .
        working-directory: packages/python

      - name: Format check
        run: uv run --no-sync ruff format --check .
        working-directory: packages/python

  ty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # `ty` type-checks the `.py` source statically and never imports the
      # compiled extension, so skip installing/building the local maturin
      # project (`uv sync` would otherwise pay a full Rust build just to
      # typecheck). `uv run --no-sync` keeps the `ty` invocation from
      # re-triggering the project install that a plain `uv run` performs
      # implicitly.
      - name: Install dependencies
        run: uv sync --no-install-project
        working-directory: packages/python

      - name: Type check (all rules promoted to error)
        run: uv run --no-sync ty check --error all --error-on-warning dirsql/
        working-directory: packages/python

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The low leg is pyproject.toml's `requires-python` floor: nothing else
        # exercises it, and a floor no job runs is a claim, not a guarantee.
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install just
        uses: extractions/setup-just@v2

      # `uv sync` builds the maturin extension (once implicitly, then again
      # explicitly via `maturin develop` below); the workspace `target/` dir
      # is shared across matrix python versions (there is no per-version
      # target-dir override), so a single Cargo.lock-keyed cache serves both
      # legs of this matrix and every other python-test job.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Install dependencies
        run: uv sync
        working-directory: packages/python

      - name: Build Rust extension
        run: uv run maturin develop
        working-directory: packages/python

      - name: Run unit tests
        run: uv run python -m pytest dirsql/ -x -q --tb=short
        working-directory: packages/python

  integration:
    # Hermetic tier (#289): SDK public API with the Rust core and the
    # filesystem mocked. The PyO3 extension is still built because
    # `dirsql/__init__.py` imports `dirsql._dirsql` at module load.
    name: Integration tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Install dependencies
        run: uv sync
        working-directory: packages/python

      - name: Build Rust extension
        run: uv run maturin develop
        working-directory: packages/python

      - name: Run integration tests
        run: uv run python -m pytest tests/integration/hermetic/ -x -q --tb=short
        working-directory: packages/python

  binding:
    # Binding tier (#289): the SDK public API against the real PyO3 core and
    # a real filesystem — proves the SDK↔core marshaling that the hermetic
    # integration tier mocks out.
    name: Binding tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Install dependencies
        run: uv sync
        working-directory: packages/python

      - name: Build Rust extension
        run: uv run maturin develop
        working-directory: packages/python

      - name: Run binding tests
        run: uv run python -m pytest tests/integration/binding/ -x -q --tb=short
        working-directory: packages/python

  # Unit coverage now runs in the reusable testing-conventions workflow
  # (conventions.yml, `python-sdk` gates: unit-coverage) after upstream #284
  # taught the coverage suite job to install/build from the derived package
  # root (python_env=uv -> `uv sync` builds maturin; provision_rust). The
  # bespoke coverage job that lived here is retired (#412).

  distcheck:
    # Functional publishability gate (#344, mirroring ts-test.yml's distcheck
    # job): build the real `dirsql` CLI binary via cargo, stage it under
    # `dirsql/_binary/` the way the release pipeline's bundle_cli step
    # would, build the wheel with `maturin build`, `pip install` it into a
    # fresh venv, and run the installed `dirsql --version` console script
    # plus `import dirsql`. Red here means the PyPI release is broken and
    # must not go out. This is the install-and-run check the `packaging`
    # gate does NOT do (that gate only asserts no test files ship in the
    # artifact). No mocks. The flow lives in the internals/distcheck package
    # (#520); this job invokes its `dirsql-distcheck python` entry point.
    name: Packaging distcheck (install + run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Install dependencies (maturin)
        run: uv sync
        working-directory: packages/python

      - name: Put maturin on PATH
        run: echo "$PWD/packages/python/.venv/bin" >> "$GITHUB_PATH"

      - name: Build dirsql CLI binary
        run: cargo build -p dirsql --features cli

      - name: Run packaging distcheck (build -> pack -> install -> run)
        run: uv run --project internals/distcheck dirsql-distcheck python
