name: Packaging

# Enforces the testing-conventions `packaging` rule for the rust crate only:
# python and typescript adopted the reusable-workflow gate directly in
# conventions.yml (#413) -- zero-config auto-build works for them. Rust can't
# adopt it: packages/rust is a Cargo workspace member, and `cargo package`
# always writes to the workspace root's target/package, never the member's
# own, so the gate's auto-build can't find it. Filed upstream; this stays
# rust-only until that's resolved.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
    paths:
      - 'packages/rust/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/packaging.yml'
  pull_request:
    paths:
      - 'packages/rust/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/packaging.yml'

permissions:
  contents: read

jobs:
  packaging:
    name: No test files in built artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install testing-conventions
        run: pip install testing-conventions

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Package Rust crate
        # `--no-verify` skips the compile-and-test verification build (we only
        # need the file manifest for the hygiene check); `--allow-dirty` keeps
        # it robust if the checkout has any generated files.
        run: cargo package -p dirsql --no-verify --allow-dirty

      - name: Check the crate ships no test files
        run: |
          set -u
          work="${RUNNER_TEMP}/packaging"
          rm -rf "$work"
          mkdir -p "$work/crate"

          # The .crate is a gzip-tar that cargo writes with trailing bytes which
          # make tar/gzip exit non-zero mid-extract, so use Python's (lenient,
          # already present) tarfile module for it.
          python -m tarfile -e target/package/*.crate "$work/crate"

          testing-conventions packaging --language rust "$work"/crate/dirsql-*
