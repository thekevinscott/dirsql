name: Packaging

# Enforces the testing-conventions `packaging` rule: test files must never ship
# in a built distribution (.whl / .tgz / .crate). Each distribution is built the
# way the release pipeline ships it, unpacked, and scanned with
# `testing-conventions packaging --language <lang>`.
#
# This is a build-dependent testing-conventions gate. Per epic #231's known
# constraint -- the testing-conventions reusable workflow has no build step and
# no build hook -- we drive the CLI inside our own job (reusing our maturin /
# napi / cargo builds) rather than calling the reusable workflow's
# `packaging_artifact` input. Adopting this gate retires the bespoke
# wheel/pack smoke tests (#238). Part of epic #231 (job 7/9).

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
    paths:
      - 'packages/python/**'
      - 'packages/ts/**'
      - 'packages/rust/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/packaging.yml'
  pull_request:
    paths:
      - 'packages/python/**'
      - 'packages/ts/**'
      - 'packages/rust/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/packaging.yml'

permissions:
  contents: read

jobs:
  packaging:
    name: No test files in built artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install testing-conventions
        run: pip install testing-conventions

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # ---- Build the three distributions the release pipeline ships ----
      - name: Build Python wheel
        working-directory: packages/python
        run: |
          uv sync --extra dev
          uv run maturin build --out dist

      - name: Build + pack npm tarball
        working-directory: packages/ts
        run: |
          pnpm install
          pnpm build
          mkdir -p dist-pack
          pnpm pack --pack-destination dist-pack

      - name: Package Rust crate
        # `--no-verify` skips the compile-and-test verification build (we only
        # need the file manifest for the hygiene check); `--allow-dirty` keeps
        # it robust if the checkout has any generated files.
        run: cargo package -p dirsql --no-verify --allow-dirty

      - name: Upload built distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: |
            packages/python/dist/*.whl
            packages/ts/dist-pack/*.tgz
            target/package/*.crate
          if-no-files-found: error

      # ---- Enforce: no test files in any built artifact ----
      - name: Check distributions ship no test files
        run: |
          set -u
          work="${RUNNER_TEMP}/packaging"
          rm -rf "$work"
          mkdir -p "$work/wheel" "$work/tgz" "$work/crate"

          # Wheel (zip) and npm tarball unpack with stock tools. The .crate is a
          # gzip-tar that cargo writes with trailing bytes which make tar/gzip
          # exit non-zero mid-extract, so use Python's (lenient, already present)
          # tarfile module for it.
          python -m zipfile -e packages/python/dist/*.whl "$work/wheel"
          tar -xzf packages/ts/dist-pack/*.tgz -C "$work/tgz"
          python -m tarfile -e target/package/*.crate "$work/crate"

          rc=0
          echo "::group::python wheel"
          testing-conventions packaging --language python "$work/wheel" || rc=1
          echo "::endgroup::"
          echo "::group::npm tarball"
          testing-conventions packaging --language typescript "$work/tgz/package" || rc=1
          echo "::endgroup::"
          echo "::group::rust crate"
          testing-conventions packaging --language rust "$work"/crate/dirsql-* || rc=1
          echo "::endgroup::"
          exit $rc
