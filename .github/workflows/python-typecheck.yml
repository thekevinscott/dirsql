name: Python Typecheck

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
    paths:
      - 'packages/python/**/*.py'
      - 'packages/python/**/*.pyi'
      - 'packages/python/pyproject.toml'
  pull_request:
    paths:
      - 'packages/python/**/*.py'
      - 'packages/python/**/*.pyi'
      - 'packages/python/pyproject.toml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # `ty` type-checks the `.py` source statically and never imports the
      # compiled extension, so skip installing/building the local maturin
      # project (`uv sync` would otherwise pay a full Rust build just to
      # typecheck). `uv run --no-sync` keeps the `ty` invocation from
      # re-triggering the project install that a plain `uv run` performs
      # implicitly.
      - name: Install dependencies
        run: uv sync --no-install-project
        working-directory: packages/python

      - name: Type check (all rules promoted to error)
        run: uv run --no-sync ty check --error all --error-on-warning dirsql/
        working-directory: packages/python
