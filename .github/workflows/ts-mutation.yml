name: TS Mutation

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# PR-only and diff-scoped (see python-mutation.yml for the rationale). Triggered
# only when the TS unit-suite source changes; a diff touching no
# `packages/ts/src` line has nothing to mutate.
on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/ts/src/**/*.ts'
      - 'testing-conventions.toml'
      - '.github/workflows/ts-mutation.yml'

permissions:
  contents: read

jobs:
  mutation:
    name: unit mutation (Stryker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so `--base <base.sha>...HEAD` can diff the PR's lines.
          fetch-depth: 0

      # `pnpm build` (napi) compiles the Rust core into `dirsql.node`.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install
        working-directory: packages/ts

      # The gate reruns the real unit suite per mutant, which loads the native
      # `dirsql.node`. The testing-conventions reusable workflow has no build
      # step (epic #231), so we build inside our own job. Stryker itself is
      # self-provisioned by the CLI -- no engine deps/config in this repo.
      - name: Build native module
        run: pnpm build
        working-directory: packages/ts

      - name: Mutation on the lines changed vs base
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        working-directory: packages/ts
        run: npx -y testing-conventions unit mutation --language typescript --base "$BASE" src
