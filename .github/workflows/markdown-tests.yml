name: Tests
run-name: ${{ (github.event.schedule == '37 5 * * *' || inputs.measure) && 'Measured tests' || 'Tests' }}

on:
  schedule:
    - cron: "7 * * * *"
    - cron: "37 5 * * *"
  workflow_dispatch:
    inputs:
      measure:
        description: Measure speed and memory
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  new-commits:
    name: New commits since the last run
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      # A scheduled run is skipped when the last run of its kind was on the same commit.
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ github.event.schedule == '37 5 * * *' && 'Measured tests' || 'Tests' }}
        run: |
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow markdown-tests.yml --limit 100 \
            --json databaseId,displayTitle,headSha \
            --jq "map(select(.databaseId != $GITHUB_RUN_ID and .displayTitle == \"$KIND\")) | .[0].headSha")
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$last" = "$GITHUB_SHA" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  markdown-tests:
    name: ${{ matrix.language }}
    needs: new-commits
    if: needs.new-commits.outputs.run == 'true'
    runs-on: ubuntu-latest
    # One stop for a hung query; no per-test timeouts.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [python, typescript, rust]
    env:
      RECIPE: ${{ (github.event.schedule == '37 5 * * *' || inputs.measure) && 'measure-md' || 'test-md' }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install dependencies
        run: |
          uv sync --project packages/python
          pnpm install --dir packages/harness-md
          pnpm install --dir packages/ts
          pnpm install --dir tests/typescript

      - name: Run
        run: uvx --from rust-just just "$RECIPE-${{ matrix.language }}"

      - name: Keep the measurements
        if: always() && env.RECIPE == 'measure-md'
        uses: actions/upload-artifact@v4
        with:
          name: measure-${{ matrix.language }}
          path: tests/${{ matrix.language }}/.harnessmd/measure.report.json
          include-hidden-files: true
