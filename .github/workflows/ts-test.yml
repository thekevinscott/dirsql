name: TS Test

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Pinned in lockstep with .github/workflows/testing-conventions.yml. Bump
  # deliberately and re-run the floor locally before changing this.
  TESTING_CONVENTIONS_VERSION: "0.0.41"

on:
  push:
    branches: [main]
    paths:
      - 'packages/ts/**'
      - 'packages/rust/**'
  pull_request:
    paths:
      - 'packages/ts/**'
      - 'packages/rust/**'

jobs:
  unit:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        working-directory: packages/ts
        run: pnpm install

      - name: Build native module
        working-directory: packages/ts
        run: pnpm build

      - name: Run unit tests
        working-directory: packages/ts
        run: pnpm test:unit

  integration:
    name: Integration tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        working-directory: packages/ts
        run: pnpm install

      - name: Build native module
        working-directory: packages/ts
        run: pnpm build

      - name: Run integration tests
        working-directory: packages/ts
        run: pnpm test:integration

  coverage:
    name: TS unit coverage floor
    runs-on: ubuntu-latest
    needs: [unit, integration]
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so the PR-only `--base` changed-lines check can diff
          # against the base commit.
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Python (for testing-conventions)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install testing-conventions
        run: pip install "testing-conventions==${TESTING_CONVENTIONS_VERSION}"

      - name: Install dependencies
        working-directory: packages/ts
        run: pnpm install

      - name: Build native module
        working-directory: packages/ts
        run: pnpm build

      - name: Unit coverage floor (testing-conventions)
        # Replaces the bespoke `pnpm coverage` vitest-thresholds gate. The CLI
        # drives the project's own vitest via `npx --no-install`, scoped to the
        # `src` unit suite ONLY (no integration padding); floor in
        # testing-conventions.toml `[typescript.coverage]`.
        working-directory: packages/ts
        run: testing-conventions unit coverage --language typescript --config ../../testing-conventions.toml src

      - name: Unit coverage floor on changed lines (PR only)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        working-directory: packages/ts
        run: testing-conventions unit coverage --language typescript --base "$BASE" --config ../../testing-conventions.toml src

  smoke:
    # Functional publishability gate: build the real binary + napi addon,
    # pack the main `dirsql` package and the host's `@dirsql/cli-<slug>`
    # sub-package the way the release pipeline would, `npm install` both
    # into a fresh dir, and run `node_modules/.bin/dirsql --version`. Red
    # here means the npm release is broken and must not go out. This is the
    # install-and-run check `packaging.yml` does NOT do (that gate only
    # asserts no test files ship in the artifact). No mocks.
    name: Packaging smoke (install + run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        working-directory: packages/ts
        run: pnpm install

      - name: Build native module + stage platform
        working-directory: packages/ts
        run: pnpm build

      - name: Run packaging smoke (build -> pack -> install -> run)
        working-directory: packages/ts
        run: pnpm test:smoke
