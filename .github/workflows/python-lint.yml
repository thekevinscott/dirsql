name: Python Lint

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
    paths:
      - 'packages/python/**/*.py'
      - 'packages/python/pyproject.toml'
      - '.github/workflows/python-lint.yml'
  pull_request:
    paths:
      - 'packages/python/**/*.py'
      - 'packages/python/pyproject.toml'
      - '.github/workflows/python-lint.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install just
        uses: extractions/setup-just@v2

      # Lint/format only touch the `.py` source and never execute the
      # compiled extension, so skip installing/building the local maturin
      # project (`uv sync` would otherwise pay a full Rust build just to run
      # ruff). `uv run --no-sync` keeps the `ruff` invocations from
      # re-triggering the project install that a plain `uv run` performs
      # implicitly.
      - name: Install dependencies
        run: uv sync --no-install-project
        working-directory: packages/python

      - name: Lint
        run: uv run --no-sync ruff check .
        working-directory: packages/python

      - name: Format check
        run: uv run --no-sync ruff format --check .
        working-directory: packages/python
