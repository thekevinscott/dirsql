name: Rust Test

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
    paths:
      - 'packages/rust/**'
      - 'packages/ts/napi/**'
      - 'packages/python/src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust-test.yml'
  pull_request:
    paths:
      - 'packages/rust/**'
      - 'packages/ts/napi/**'
      - 'packages/python/src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust-test.yml'

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Run unit tests
        run: cargo test --manifest-path packages/rust/Cargo.toml --features cli --lib

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Run integration tests
        run: cargo test --manifest-path packages/rust/Cargo.toml --features cli --tests

  coverage:
    name: Rust coverage floor (90%)
    runs-on: ubuntu-latest
    needs: [unit, integration]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-28
          components: llvm-tools-preview

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run coverage
        run: cargo llvm-cov --manifest-path packages/rust/Cargo.toml --features cli --branch --fail-under-branches 65 --fail-under-lines 90

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Format check
        run: cargo fmt --all -- --check

      # Silent-skip canary: without `--features cli`, the `dirsql` bin target
      # must be gated off by `required-features = ["cli"]`. If someone drops
      # that line, a default `cargo install dirsql` would pull clap into every
      # library consumer's build -- this guard catches that regression.
      #
      # Uses an isolated --target-dir so a cached `target/debug/dirsql`
      # (built with --features cli on a previous run and restored by
      # actions/cache) can't mask a regression.
      - name: Silent-skip canary (no bin without cli feature)
        run: |
          cargo build -p dirsql --locked --target-dir target/canary
          test ! -x target/canary/debug/dirsql

      - name: CLI feature build + smoke
        run: |
          cargo build -p dirsql --features cli --locked
          ./target/debug/dirsql --version
