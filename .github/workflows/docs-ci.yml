name: Docs Build

# Verification only. docs-release.yml publishes on push to main; its deploy
# job consumes the Pages artifact its build job uploads in the same run, so
# it cannot be reused here -- gating that deploy with `if:` would still
# report a second, skipped check on every docs PR.
# Turned off: the hourly Tests workflow and CI Gate replace the pull request checks.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: docs
        run: npm install

      - name: Build VitePress
        working-directory: docs
        run: npx vitepress build
