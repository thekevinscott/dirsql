name: GHA Scripts

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# CI logic extracted out of workflow YAML lives in .github/scripts/ with
# colocated unit tests (AGENTS.md "CI Workflows"). This gate runs those tests
# under a 100% coverage floor so the extracted logic stays tested. The job is
# itself trivial glue -- install pytest, run it -- per the rule it enforces.
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/**'
  pull_request:
    paths:
      - '.github/scripts/**'

permissions:
  contents: read

jobs:
  test:
    name: scripts unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest
        run: pip install pytest pytest-cov pytest-describe

      # Presence guard: the scripts dir may be empty (all extracted CI logic can
      # be retired). pytest over an empty/absent dir errors ("no tests ran"), so
      # skip cleanly when there are no `*_test.py`. A real script-adding PR brings
      # its colocated test (AGENTS.md "CI Workflows"), which flips this back on.
      - name: Run .github/scripts unit tests (100% coverage)
        run: |
          shopt -s nullglob
          tests=(.github/scripts/*_test.py)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "No .github/scripts/*_test.py present — nothing to test."
            exit 0
          fi
          python -m pytest .github/scripts/ --cov=.github/scripts --cov-report=term-missing --cov-fail-under=100
