name: GHA Scripts

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# CI logic extracted out of workflow YAML lives in .github/scripts/ with
# colocated unit tests (AGENTS.md "CI Workflows"). This gate runs those tests
# under a 100% coverage floor so the extracted logic stays tested. The job is
# itself trivial glue -- install pytest, run it -- per the rule it enforces.
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/**'
      - '.github/workflows/gha-scripts.yml'
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/gha-scripts.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: scripts unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Sync the checks package
        run: uv sync --project .github/scripts/checks

      # pytest_gate translates pytest exit 5 (no tests collected) to 0, so an
      # empty scripts dir passes cleanly while pytest's own recursive collection
      # finds nested `.../foo_test.py`. Any other nonzero (test or coverage
      # failure) propagates. The gate here runs itself over the checks package.
      - name: Run .github/scripts/checks unit tests (100% coverage)
        run: uv run --project .github/scripts/checks dirsql-checks pytest-gate .github/scripts/checks/src --cov=checks --cov-report=term-missing --cov-fail-under=100
