name: GHA Scripts

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# CI logic extracted out of workflow YAML lives in .github/scripts/ with
# colocated unit tests (AGENTS.md "CI Workflows"). This gate runs those tests
# under a 100% coverage floor so the extracted logic stays tested. The job is
# itself trivial glue -- install pytest, run it -- per the rule it enforces.
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/**'
      - '.github/workflows/gha-scripts.yml'
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/gha-scripts.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: scripts unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest
        run: pip install pytest pytest-cov pytest-describe

      # pytest_gate translates pytest exit 5 (no tests collected) to 0, so an
      # empty scripts dir passes cleanly while pytest's own recursive collection
      # finds nested `.../foo_test.py`. Any other nonzero (test or coverage
      # failure) propagates.
      - name: Run .github/scripts unit tests (100% coverage)
        run: python .github/scripts/pytest_gate.py .github/scripts/ --cov=.github/scripts --cov-report=term-missing --cov-fail-under=100
