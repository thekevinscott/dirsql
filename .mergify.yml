# Mergify reads this file from the default branch only. Edits on a feature
# branch are inert until they land on main.

# No summary comment on PRs -- the Required check run carries the same
# condition breakdown and stays current, while the comment is a stale
# point-in-time snapshot cluttering the thread.
merge_protections_settings:
  post_comment: false

merge_protections:
  - name: All CI green
    description: Every check on this PR finished, and none failed.
    if:
      - base = main
    success_conditions:
      # Do NOT add `#check-pending = 0`: merge protections count their own
      # in-progress check, so the total never reaches zero and the gate
      # deadlocks. Confirmed on #946 -- Mergify sat pending with an empty
      # "waiting checks" list after every other check had finished.
      #
      # The cost is that this condition is vacuously true before CI starts,
      # so the gate goes green while checks are still running (#943).
      - "#check-failure = 0"

pull_request_rules:
  - name: Auto-merge labelled PRs once every check is green
    conditions:
      - base = main
      - label = auto-merge
      - "#approved-reviews-by >= 1"
      - "#check-failure = 0"
      - "#check-pending = 0"
    actions:
      merge:
        method: merge
