# Mergify reads this file from the default branch only. Edits on a feature
# branch are inert until they land on main.

# No summary comment on PRs -- the Required check run carries the same
# condition breakdown and stays current, while the comment is a stale
# point-in-time snapshot cluttering the thread.
merge_protections_settings:
  post_comment: false

merge_protections:
  - name: All CI green
    description: Every check on this PR finished, and none failed.
    if:
      - base = main
    success_conditions:
      # Names no checks deliberately: a path-filtered workflow that does not run
      # reports nothing, so an anchor naming it would pend forever.
      - "#check-failure = 0"
      - "#check-pending = 0"

pull_request_rules:
  - name: Auto-merge labelled PRs once every check is green
    conditions:
      - base = main
      - label = auto-merge
      - "#approved-reviews-by >= 1"
      - "#check-failure = 0"
      - "#check-pending = 0"
    actions:
      merge:
        method: merge
