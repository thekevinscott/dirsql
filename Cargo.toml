[workspace]
members = ["packages/python", "packages/rust", "packages/ts/napi"]
# Test-only loadable-extension fixture, built on demand by
# packages/rust/tests/extensions.rs. Excluded so it isn't built/linted by
# `cargo build --workspace` / `cargo clippy --workspace`.
exclude = ["packages/rust/tests/fixtures/testext"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/thekevinscott/dirsql"

[workspace.dependencies]
dirsql = { path = "packages/rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync"] }
futures-channel = "0.3"

# Cargo's default release profile ships every binary unstripped, without
# cross-crate optimization. The three published artifacts (CLI bin, pyo3
# extension, napi addon) are each a statically linked copy of the whole core,
# so the defaults cost ~31% of every download (#717).
#
# `panic` stays at the default `unwind`: pyo3 and napi turn Rust panics into
# Python/JS exceptions, which requires unwinding.
[profile.release]
strip = "symbols"
lto = "fat"
codegen-units = 1

