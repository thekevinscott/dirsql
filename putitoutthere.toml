# putitoutthere release configuration.
#
# Four published artifacts. The core three are all named `dirsql` on
# their respective registries (crates.io, PyPI, npm); they share a
# workspace version and release together, but each gets its own tag
# (default `{name}-v{version}`) because putitoutthere tags are per-package.
#
# Cascade: a change under `packages/rust/**` cascades into the Python and
# npm packages via `depends_on`, so a single Rust edit republishes all
# three in topological order.
#
# The fourth, `dirsql-plugin-embeddings`, is an independently-versioned
# pure-Python plugin published as its own PyPI project. It is deliberately
# outside the cascade -- it releases only when its own path changes.
#
# Every package subtree is globbed as a PAIR of extglob patterns rather than a
# bare `<root>/**`, because merging to `main` publishes and a bare glob cascades
# on files that never reach the artifact -- fragment dirs, e2e attestation
# receipts, the package's testing-conventions gate config. Run 371 republished
# `dirsql-py` and `dirsql-npm` byte-identical off two new gate configs (#944).
#
# The extglob is load-bearing and a leading `!` is NOT a substitute. Verified at
# the pinned `@v0` sha 8f5876751f679ee3450617957c97495205002499: `globs` is a
# plain `string[]` on a `.strict()` schema (no exclusion key is representable),
# and both consumers go through `glob.ts`'s `matchesAny`, an OR that returns on
# the first hit. Under minimatch a `!`-prefixed pattern matches every path
# OUTSIDE its subtree, so `!packages/rust/changelog.d/**` would not subtract the
# fragment -- it would make `README.md` match and cascade on every commit.
# `dirsql-checks release-globs` fails the PR if these drift back.
#
# Two patterns per root because one extglob cannot span both depths: the first
# covers files sitting directly in the package root, the second everything under
# its subdirectories. It stays a carve-out, not an allowlist -- a subdirectory or
# root file added later is matched automatically.

[putitoutthere]
version = 1

# crates.io: the consolidated `dirsql` library + CLI binary. Library
# consumers (`cargo add dirsql`) get the SDK; `cargo install dirsql
# --features cli` builds the binary.
[[package]]
name  = "dirsql-rust"
crate = "dirsql"
kind  = "crates"
path  = "packages/rust"
globs = [
  "packages/rust/!(testing-conventions.toml)",
  "packages/rust/!(changelog.d|migrations.d|e2e-attestations)/**",
  "Cargo.toml",
  "Cargo.lock",
]
first_version = "0.2.8"

# PyPI: maturin-built wheels per target. The wheel's extension module
# carries both the SDK and the CLI (`run_cli`, built with the core's `cli`
# feature), so `pip install dirsql && dirsql ...` and `uvx dirsql` work
# end-to-end off one artifact -- no bundled binary since #738.
[[package]]
name  = "dirsql-py"
pypi  = "dirsql"
kind  = "pypi"
build = "maturin"
# Build linux wheels in the manylinux_2_28 container so the platform tag
# pins a glibc 2.28 floor. Without it, wheels are tagged with the
# runner's glibc (manylinux_2_39 on ubuntu-24.04) and pip on any older
# host silently falls back to the sdist and compiles from source
# (dirsql#818).
manylinux = "2_28"
path  = "packages/python"
globs = [
  "packages/python/!(testing-conventions.toml)",
  "packages/python/!(changelog.d|migrations.d|e2e-attestations)/**",
  "packages/rust/!(testing-conventions.toml)",
  "packages/rust/!(changelog.d|migrations.d|e2e-attestations)/**",
  "Cargo.toml",
  "Cargo.lock",
]
depends_on    = ["dirsql-rust"]
first_version = "0.2.8"
targets = [
  "x86_64-unknown-linux-gnu",
  # aarch64 cross-compile from x86_64 ubuntu-latest fails at link time
  # (hit during v0.2.0). The free `ubuntu-24.04-arm` runner sidesteps
  # the cross toolchain entirely.
  { triple = "aarch64-unknown-linux-gnu", runner = "ubuntu-24.04-arm" },
  # Both apple-darwin targets build on macos-latest (arm64); the Intel
  # target is cross-compiled from arm64. Free `macos-13` (x64) runners
  # were deprecated in 2024.
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  # Pin Windows runner explicitly: GitHub redirects `windows-2025`
  # (the default `windows-latest` resolves to) to `windows-2025-vs2026`
  # on 2026-05-12. Pinning lets us control the toolchain switch (VS
  # 2022 -> VS 2026) and surfaces breakage in a release we can react
  # to. See dirsql#175.
  { triple = "x86_64-pc-windows-msvc", runner = "windows-2025-vs2026" },
]

# No `[package.bundle_cli]` for pypi either (#738): the wheel's extension
# module carries the CLI, so there is no per-target binary to cross-compile
# or stage. Neither published package ships a standalone binary now; the
# crates.io lane still builds one via `cargo install dirsql --features cli`.

# npm: one family. `@dirsql/lib-{triple}` ships the napi-rs `.node`
# addon, which since #739 carries the CLI too (`runCli`, built with the
# core's `cli` feature) — the launcher calls it in-process instead of
# spawning a binary. The `@dirsql/cli-{triple}` family that used to ship
# a second copy of the core is gone; the top-level `dirsql` package's
# `optionalDependencies` pin one addon per platform.
[[package]]
name  = "dirsql-npm"
npm   = "dirsql"
kind  = "npm"
path  = "packages/ts"
globs = [
  "packages/ts/!(testing-conventions.toml)",
  "packages/ts/!(changelog.d|migrations.d|e2e-attestations)/**",
  "packages/rust/!(testing-conventions.toml)",
  "packages/rust/!(changelog.d|migrations.d|e2e-attestations)/**",
  "Cargo.toml",
  "Cargo.lock",
]
depends_on    = ["dirsql-rust"]
first_version = "0.2.8"
build = [
  { mode = "napi", name = "@dirsql/lib-{triple}" },
]
targets = [
  "linux-x64-gnu",
  { triple = "linux-arm64-gnu", runner = "ubuntu-24.04-arm" },
  # Both darwin targets build on macos-latest (arm64); the Intel target
  # is cross-compiled from arm64.
  "darwin-x64",
  "darwin-arm64",
  # See note on the PyPI Windows target above re: the 2026-05-12
  # `windows-2025` -> `windows-2025-vs2026` redirect (dirsql#175).
  { triple = "win32-x64-msvc", runner = "windows-2025-vs2026" },
]

# No `[package.bundle_cli]` here any more (#739): the npm lane ships no
# standalone binary. The addon built by the `napi` row carries the CLI,
# so the cross-compile / stage / verify steps upstream gates on
# `matrix.bundle_cli` have nothing to do for this package.

# PyPI: the in-repo embeddings plugin (plugins/dirsql-plugin-embeddings/).
# Pure-Python (hatchling) — no `build = "maturin"`, no native `targets`,
# no `[package.bundle_cli]`. Deliberately NOT in the rust `depends_on`
# cascade: a core change must not republish this plugin, and it is
# independently versioned on its own v0.1.x line rather than the
# workspace 0.2.x line the other three packages share.
[[package]]
name  = "dirsql-plugin-embeddings"
pypi  = "dirsql-plugin-embeddings"
kind  = "pypi"
build = "hatch"
path  = "plugins/dirsql-plugin-embeddings"
globs = [
  "plugins/dirsql-plugin-embeddings/!(testing-conventions.toml)",
  "plugins/dirsql-plugin-embeddings/!(changelog.d|migrations.d|e2e-attestations)/**",
]
first_version = "0.1.0"
