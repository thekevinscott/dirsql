# putitoutthere release configuration.
#
# Three published artifacts, all named `dirsql` on their respective
# registries (crates.io, PyPI, npm). They share a workspace version and
# release together, but each gets its own tag (default `{name}-v{version}`)
# because putitoutthere tags are per-package.
#
# Cascade: a change under `packages/rust/**` cascades into the Python and
# npm packages via `depends_on`, so a single Rust edit republishes all
# three in topological order.

[putitoutthere]
version = 1

# crates.io: the consolidated `dirsql` library + CLI binary. Library
# consumers (`cargo add dirsql`) get the SDK; `cargo install dirsql
# --features cli` builds the binary.
[[package]]
name  = "dirsql-rust"
crate = "dirsql"
kind  = "crates"
path  = "packages/rust"
globs = [
  "packages/rust/**",
  "Cargo.toml",
  "Cargo.lock",
]
first_version = "0.2.8"

# PyPI: maturin-built wheels per target with the Rust CLI binary bundled
# inside each wheel. `[package.bundle_cli]` below (putitoutthere ≥
# v0.2.17) cross-compiles the `dirsql` bin per target with
# `--features cli` (gated behind `[[bin]] required-features` in
# `packages/rust/Cargo.toml`), stages it into
# `packages/python/python/dirsql/_binary/`, and the
# `[tool.maturin].include` glob picks it up so `pip install dirsql &&
# dirsql ...` and `uvx dirsql` work end-to-end. Upstream verifies wheel
# contents post-build (`_matrix.yml` wheel-content guard).
[[package]]
name  = "dirsql-py"
pypi  = "dirsql"
kind  = "pypi"
build = "maturin"
path  = "packages/python"
globs = [
  "packages/python/**",
  "packages/rust/**",
  "Cargo.toml",
  "Cargo.lock",
]
depends_on    = ["dirsql-rust"]
first_version = "0.2.8"
targets = [
  "x86_64-unknown-linux-gnu",
  # aarch64 cross-compile from x86_64 ubuntu-latest fails at link time
  # (hit during v0.2.0). The free `ubuntu-24.04-arm` runner sidesteps
  # the cross toolchain entirely.
  { triple = "aarch64-unknown-linux-gnu", runner = "ubuntu-24.04-arm" },
  # Both apple-darwin targets build on macos-latest (arm64); the Intel
  # target is cross-compiled from arm64. Free `macos-13` (x64) runners
  # were deprecated in 2024.
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  # Pin Windows runner explicitly: GitHub redirects `windows-2025`
  # (the default `windows-latest` resolves to) to `windows-2025-vs2026`
  # on 2026-05-12. Pinning lets us control the toolchain switch (VS
  # 2022 -> VS 2026) and surfaces breakage in a release we can react
  # to. See dirsql#175.
  { triple = "x86_64-pc-windows-msvc", runner = "windows-2025-vs2026" },
]

# crate_path defaults to "." (workspace root), which is what we want:
# cargo's target dir is workspace-rooted, so `cargo build --bin dirsql`
# from repo root produces `target/<triple>/release/dirsql`, which is
# exactly where putitoutthere's stage step looks.
[package.bundle_cli]
bin      = "dirsql"
stage_to = "python/dirsql/_binary"
features = ["cli"]

# npm: the dual-family pattern. `@dirsql/lib-{triple}` ships the napi-rs
# `.node` addon; `@dirsql/cli-{triple}` ships the CLI binary. The
# top-level `dirsql` package's `optionalDependencies` pin one of each
# per platform; npm installs exactly the right pair at install time.
# This is the `@swc/core` / dirsql distribution shape.
[[package]]
name  = "dirsql-npm"
npm   = "dirsql"
kind  = "npm"
path  = "packages/ts"
globs = [
  "packages/ts/**",
  "packages/rust/**",
  "Cargo.toml",
  "Cargo.lock",
]
depends_on    = ["dirsql-rust"]
first_version = "0.2.8"
build = [
  { mode = "napi",        name = "@dirsql/lib-{triple}" },
  { mode = "bundled-cli", name = "@dirsql/cli-{triple}" },
]
targets = [
  "linux-x64-gnu",
  { triple = "linux-arm64-gnu", runner = "ubuntu-24.04-arm" },
  # Both darwin targets build on macos-latest (arm64); the Intel target
  # is cross-compiled from arm64.
  "darwin-x64",
  "darwin-arm64",
  # See note on the PyPI Windows target above re: the 2026-05-12
  # `windows-2025` -> `windows-2025-vs2026` redirect (dirsql#175).
  { triple = "win32-x64-msvc", runner = "windows-2025-vs2026" },
]
