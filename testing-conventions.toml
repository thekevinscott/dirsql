# testing-conventions CLI config (https://github.com/thekevinscott/testing-conventions).
#
# The repo-wide DEFAULT config: the CLI reads this file when a caller names no
# other, which today means the rust core lane (dirsql-rust-ci.yml) and
# internals/distcheck. Lanes carrying their own `testing-conventions.toml`
# (packages/python, packages/ts, internals/checks, the embeddings plugin) do not
# read it, and restate the tables their gates need.
#
# The `[[<lang>.exempt]]` array lists files waived from a rule (the colocation
# gate fails on any source file lacking a colocated unit test that is not
# listed; `rules = ["mutation"]` waives an equivalent/defensive surviving mutant
# -- none today, since mutation is diff-scoped to a PR's own changed lines). The
# `[<lang>.coverage]` table sets the unit-only coverage floor the `unit
# coverage` job enforces.
#
# There are ZERO exemptions below. The three-tier conformance work (#517) is
# complete: the binding suites moved into the recognized tier
# `tests/integration/binding/` (#519) and the packaging distcheck flows moved to the
# `internals/distcheck` package (#520), so nothing trips `unknown-tier` anymore.
# Every re-export/empty barrel is verified without a waiver -- the TS `index.ts`
# barrel has `index.test.ts`, the python `__init__.py` barrel has
# `__init___test.py`, empty package inits (`cli/__init__.py`) are auto-skipped
# by the tool, and the dead `cli/interpret` shells were deleted. The former
# python isolation waiver on the python barrel's *test* was removed once
# testing-conventions#382 / PR #384 brought the python `unmocked-collaborator`
# rule to parity with TS (a bare package-relative import `from . import <names>`
# in a barrel test now resolves to the SUT and passes).
#
# When an entry is added, its `path` is relative to the subject root the waived
# rule resolves against: the scanned source dir (packages/python/dirsql /
# packages/ts/src) for source-file rules (colocated-test, coverage), or the
# derived package root (packages/python / packages/ts) for the suite-tier rule
# `unknown-tier` (testing-conventions#417). The CLI rejects an exempt entry whose
# `path` matches no file, so the list self-cleans: an entry must be deleted the
# moment its file gains a real colocated test, is removed, or is relocated into a
# recognized tier. Keep coverage/colocation entries in lockstep with the
# coverage-omit rationale in packages/python/pyproject.toml and
# packages/ts/vitest.config.ts.
#
# Floors: AGENTS.md mandates >=90% per SDK; both bindings currently hold the
# stricter 100% unit-only floor below (the honest maximum, no waivers needed).
# Rust (added #295) is measured unit-only via `cargo llvm-cov --lib --features
# cli`: the CLI now scopes to `--lib` and passes `[rust].features` through
# (testing-conventions #269/#270/#271). Its floors sit below the bindings' 100%
# because effectful code (filesystem / subprocess / HTTP / `notify`) lives in
# the integration tier by design (#233), so the unit tier cannot reach it.
# In #354 pure unit tests were added to close the reachable unit-tier gaps and
# the floors were then pulled up as high as they robustly go (lines 94 /
# regions 93 / functions 91 / branch 75); `branch` keeps a documented sub-90
# floor as an accepted exception -- see the `[rust.coverage]` block below for
# the rationale and a fragility warning about the near-zero slack.

# --- Shared-core e2e freshness (#337, via upstream #333) --------------------
#
# The Rust core (`packages/rust/src`) compiles into BOTH bindings but lives in
# neither binding's e2e `--scope` (`packages/python/dirsql`, `packages/ts/src`),
# so `e2e verify` was structurally blind to a core change -- the binding
# attestations stayed "fresh" while the shipped binary's behavior changed. This
# `[e2e]` block declares the core as an extra freshness root: `detect.py` reads
# it and the reusable `e2e-verify` job passes `--extra-scope`/`--exclude`, so a
# non-`cli` `packages/rust/src` change now stales BOTH bindings' attestations and
# CI demands re-attestation. This is the promise the deleted `e2e_core_freshness.py`
# enforced, now pure config -- no bespoke gate, no upstream wait (the capability
# shipped as #333). Proven locally: over a `packages/rust/src`-only diff,
# `e2e verify` is exit 0 without `--extra-scope` and exit 1 with it.
#
# `cli`-only core (`src/cli`, `src/bin`) is NOT carved out. It is feature-gated
# out of the binding *libraries*, but since #721 each launcher calls the core's
# `run_cli` in-process through its binding, so a CLI change alters what those
# suites exercise just as any other core change does. Every `packages/rust/src`
# change stales both bindings' attestations.
#
# Neither binding reads this block since #933: each needs the core PLUS its own
# glue, which only a per-package config can express, so both SDK lanes pass
# their own `packages/<pkg>/testing-conventions.toml`. It stays as the default,
# so a caller that declares no config still inherits the core root.
[e2e]
extra_scope = ["packages/rust/src"]

# --- Python (scanned: packages/python/dirsql) ------------------------------

[python]
one_function_per_file = { max_lines = 16 }

# Unit-only coverage floor (branch coverage on, matching the prior --cov-branch).
# The default for a config-less python caller (internals/distcheck); the
# packages/python lane holds the identical floor in its own config.
[python.coverage]
fail_under = 100
branch = true

# --- TypeScript (scanned: packages/ts/src) ---------------------------------

# NB: the `[typescript]` table only accepts `coverage` / `exempt` -- there is no
# `[typescript].build_command` (that config key is python-only). The TS
# suite-executing gates (mutation, unit-coverage) load the native napi
# `dirsql.node`; post-#289 that build is provisioned automatically because
# `packages/ts/napi` declares a napi build (auto-provisioning without a
# build_command field), with `rust_toolchain: true` on the caller supplying cargo.

[typescript]
one_function_per_file = { max_lines = 16 }

# Unit-only coverage floor, per vitest metric.
[typescript.coverage]
lines = 100
functions = 100
statements = 100
branches = 100

# --- Rust (scanned: packages/rust/src) -------------------------------------

# `features` is forwarded to `cargo llvm-cov --features` (and cargo-mutants) so
# the `#[cfg(feature = "cli")]` module is compiled, measured, and mutated
# (testing-conventions #270). Without it the whole CLI module compiles out and
# is silently unmeasured.
[rust]
features = ["cli"]

# Unit-only coverage floor: measured by `cargo llvm-cov --lib --features cli`
# (the `--lib` scoping keeps the integration tier under packages/rust/tests/ out
# of the number -- testing-conventions #269). `branch` runs under `--branch`,
# which needs the nightly toolchain pinned in dirsql-rust-ci.yml's coverage job.
#
# The floors are BELOW the bindings' 100% because the effectful paths in
# lib.rs / cli/*.rs / watcher.rs are exercised at the integration/e2e tier by
# design (#233), not the unit tier.
#
# #354 first added pure unit tests to close the reachable unit-tier gaps
# (cli/router.rs `parse_sql_body`, cli/mod.rs `with_query_timeout` /
# `From<String>`, cli/init.rs error `Display` arms), lifting the measured
# unit-only coverage to lines 94.1% / regions 93.2% / functions 91.6% /
# branch 75.6%. The floors below are then set as HIGH as they robustly go --
# the highest integer under each actual:
#   - lines: 94 (actual 94.1%).
#   - regions: 93 (actual 93.2%).
#   - functions: 91 (actual 91.6%).
#   - branch: 75 (actual 75.6%), kept BELOW the >=90% ideal as an accepted,
#     documented exception (see reasons below).
#
# WARNING -- these floors are pinned near their actuals (<1pt of slack), by
# maintainer request. The whole-tree gate will therefore go red on any PR that
# lowers a dimension even slightly. This is MOST fragile for `branch`: because
# `--branch` counts test-assertion guards (reason (2) below), a PR that merely
# ADDS well-formed unit tests can lower branch % and trip the floor. When that
# happens the fix is usually to nudge the affected floor DOWN to the new actual,
# not to treat the dip as a regression to chase.
#
# Why `branch` in particular cannot reach the >=90% ideal at the unit tier:
#   (1) The effectful production branches live in the integration/e2e tier by
#       design (#233): cli/router.rs's async HTTP handlers, cli/init.rs's
#       `claude`-spawn arms, and lib.rs's racy-window/watcher/persist error arms
#       are unreachable from a unit test; covering them re-litigates #233.
#   (2) `--branch` instruments the crate WITH its `#[cfg(test)]` modules, so
#       every `matches!(…, if a && b)` / `assert!(x && y)` guard in a unit test
#       adds short-circuit sub-condition branches whose False arm is unreachable
#       by construction (the assertion is written to pass). differ.rs is the
#       clearest case: 100% line/region/function coverage but 58% branch, every
#       uncovered branch inside a test-module guard, not production code.
[rust.coverage]
# Nudged down one point each (lines 94->93, regions 93->92, functions 91->90)
# when the path-table vtab landed (#626), which is the "near-zero slack"
# scenario the header warns about. The module is disproportionately code the
# unit tier structurally cannot reach: the `VTab`/`VTabCursor` trait impls need
# a real `rusqlite::Connection`, and `unit lint`'s isolation rule permits a Rust
# unit test to call only `super::` and pure std, so constructing one in-process
# is not allowed. Its pure logic was extracted and IS unit-tested (argument
# parsing, column selection, cursor arithmetic, row building via an injected
# stat fn), taking the file from 48% to 77% lines; what remains uncovered is
# exactly the FFI glue plus `read_text`'s `std::fs` call.
#
# Floors follow actuals rather than the reverse, per the header: they ratchet
# against regression, they are not an aspiration to chase. Actuals at the time
# of writing: lines 93.66, regions 92.84, functions 90.80, branch 79.09.
#
# A file-scoped coverage exemption was rejected as the alternative: exemptions
# here waive a whole file (see the header's note on `path`), which would blind
# the gate to every future regression in `vtab.rs`, and AGENTS.md directs
# authors to inject and mock rather than exclude a file.
#
# Nudged again (lines 93->92, regions 92->91) when the CLI moved out of
# `src/bin/dirsql.rs` into `src/cli/run.rs` (#737). This is a DENOMINATOR
# change, not a regression: `--lib` never measured the bin target, so ~900
# lines of argument parsing and command dispatch were invisible to this gate
# while sitting in `bin/`. Not one test was deleted and no code became less
# tested -- the same code with the same tests simply entered the measured
# population. `cli/run.rs` lands at 47% lines, which is precisely the profile
# of its already-accepted siblings `cli/execute.rs` (45%) and `cli/router.rs`
# (53%): effectful paths (filesystem, subprocess, HTTP, signal handling)
# covered at the integration/e2e tier by design (#233). Its pure logic --
# argv config-path scanning, `--extension` spec parsing, `--on-file`
# resolution, query-body framing -- keeps the inline unit tests that moved
# with it.
#
# `functions` ratchets UP 90->91 (actual 91.72).
#
# `branch` moves DOWN 75->72, and the reason is worth being precise about
# because the number is counter-intuitive: it is NOT the header's
# test-assertion-guard artifact. llvm-cov emits no branch regions at all for a
# function that never executes, so while `run_cli` was unreachable from the
# unit tier every branch inside `load_state` / `load_pre_queries` /
# `load_post_queries` / `run_server` was invisible to the metric. The #737
# tests call `run_cli`, which materializes 52 real production branches, 49 of
# them on the effectful paths that live in the integration tier by design
# (#233). The dimension therefore measures MORE of the codebase than it did
# at 75, not less of it: 72.24% of 508 branches is 367 covered, against 366 of
# 458 at the old number. A higher floor here was available only by keeping
# those branches hidden, which is a flattering number rather than a stronger
# gate.
#
# Actuals at the time of writing: lines 92.46, regions 91.95, functions 91.72,
# branch 72.24.
lines = 92
functions = 91
regions = 91
branch = 72
