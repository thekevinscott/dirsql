# testing-conventions CLI config (https://github.com/thekevinscott/testing-conventions).
#
# Drives the testing-conventions gates wired up in
# .github/workflows/testing-conventions.yml (colocated-test + unit lint), the
# per-package `unit coverage` jobs in python-test.yml / ts-test.yml, and the
# per-language `unit mutation` jobs in {python,ts,rust}-mutation.yml. The CLI
# reads this file by default.
#
# The `[[<lang>.exempt]]` array lists files waived from a rule (the colocation
# gate fails on any source file lacking a colocated unit test that is not
# listed; `rules = ["mutation"]` waives an equivalent/defensive surviving mutant
# -- none today, since mutation is diff-scoped to a PR's own changed lines). The
# `[<lang>.coverage]` table sets the unit-only coverage floor the `unit
# coverage` job enforces.
#
# `path` is relative to the scanned source dir (packages/python/dirsql for the
# `[[python.exempt]]` entries, packages/ts/src for the `[[typescript.exempt]]`
# entries). The CLI rejects an exempt entry whose `path` matches no file, so
# this list self-cleans: delete an entry the moment its file gains a real
# colocated test (or is removed). Keep it in lockstep with the coverage-omit
# rationale in packages/python/pyproject.toml and packages/ts/vitest.config.ts.
#
# Floors: AGENTS.md mandates >=90% per SDK; both bindings currently hold the
# stricter 100% unit-only floor below (the honest maximum, no waivers needed).
# Rust (added #295) is measured unit-only via `cargo llvm-cov --lib --features
# cli`: the CLI now scopes to `--lib` and passes `[rust].features` through
# (testing-conventions #269/#270/#271). Its floors sit below the bindings' 100%
# because effectful code (filesystem / subprocess / HTTP / `notify`) lives in
# the integration tier by design (#233), so the unit tier cannot reach it. The
# `functions`/`branch` floors are an honest interim below the >=90% ideal;
# raising them is tracked in the #295 follow-up.

# --- Python (scanned: packages/python/dirsql) ------------------------------

[[python.exempt]]
path = "__init__.py"
rules = ["colocated-test"]
reason = "Package barrel: re-exports the public API (DirSQL, Table, RowEvent, __version__). Covered by the SDK integration tests; no isolated logic to unit-test."

[[python.exempt]]
path = "cli/__init__.py"
rules = ["colocated-test"]
reason = "Package docstring only; no logic to unit-test."

[[python.exempt]]
path = "cli/interpret/__init__.py"
rules = ["colocated-test", "co-change"]
reason = "Empty package shell left after the native-config `interpret` removal (#321/#323): docstring only, no logic, no re-exports. `co-change` is waived because a barrel has no colocated test to co-change when its docstring is edited. The directory cannot be fully deleted yet -- the co-change check flags a deleted source lacking a co-deleted test, and a retained exempt for a deleted path is rejected as stale."

# Unit-only coverage floor (branch coverage on, matching the prior --cov-branch).
[python.coverage]
fail_under = 100
branch = true

# --- TypeScript (scanned: packages/ts/src) ---------------------------------

[[typescript.exempt]]
path = "index.ts"
rules = ["colocated-test", "co-change"]
reason = "True barrel: re-exports the public API surface (DirSQL, Table, parseTableName, types) from the colocated-tested implementation modules (table.ts, core.ts, parse-table-name.ts, dirsql.ts). The logic that used to live here was extracted into those unit-tested modules (#239), leaving only re-exports. `co-change` is waived because there is no colocated unit test to co-change when a submodule rename moves an import path here."

[[typescript.exempt]]
path = "cli/interpret/index.ts"
rules = ["colocated-test", "co-change"]
reason = "Empty package shell left after the native-config `interpret` removal (#321/#324): a comment + `export {}`, no logic, no re-exports. `co-change` is waived because a barrel has no colocated test to co-change when it is edited. The directory cannot be fully deleted yet -- the co-change check flags a deleted source lacking a co-deleted test, and a retained exempt for a deleted path is rejected as stale."

# Unit-only coverage floor, per vitest metric.
[typescript.coverage]
lines = 100
functions = 100
statements = 100
branches = 100

# --- Rust (scanned: packages/rust/src) -------------------------------------

# `features` is forwarded to `cargo llvm-cov --features` (and cargo-mutants) so
# the `#[cfg(feature = "cli")]` module is compiled, measured, and mutated
# (testing-conventions #270). Without it the whole CLI module compiles out and
# is silently unmeasured.
[rust]
features = ["cli"]

# Unit-only coverage floor: measured by `cargo llvm-cov --lib --features cli`
# (the `--lib` scoping keeps the integration tier under packages/rust/tests/ out
# of the number -- testing-conventions #269). `branch` runs under `--branch`,
# which needs the nightly toolchain pinned in rust-test.yml's coverage job.
#
# Floors are the honest unit-only maxima less a small margin. They are BELOW the
# bindings' 100% (and `functions`/`branch` below the >=90% ideal) because the
# effectful paths in lib.rs / cli/*.rs / watcher.rs are exercised at the
# integration/e2e tier by design (#233), not the unit tier. Raising them toward
# >=90% across the board is tracked in the #295 follow-up issue.
[rust.coverage]
lines = 90
functions = 80
regions = 90
branch = 70
