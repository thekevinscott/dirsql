# testing-conventions CLI config (https://github.com/thekevinscott/testing-conventions).
#
# Drives the testing-conventions gates wired up in the reusable-workflow calls
# in .github/workflows/conventions.yml (colocated-test + unit lint +
# integration-lint), the per-package `unit coverage` jobs in python-test.yml /
# ts-test.yml / rust-test.yml, and the per-language `unit mutation` jobs in
# {python,ts,rust}-mutation.yml. The CLI reads this file by default.
#
# The `[[<lang>.exempt]]` array lists files waived from a rule (the colocation
# gate fails on any source file lacking a colocated unit test that is not
# listed; `rules = ["mutation"]` waives an equivalent/defensive surviving mutant
# -- none today, since mutation is diff-scoped to a PR's own changed lines). The
# `[<lang>.coverage]` table sets the unit-only coverage floor the `unit
# coverage` job enforces.
#
# There is exactly ONE exemption below, and it is tool-blocked, not a barrel
# waiver: every re-export/empty barrel is now handled without a colocated-test
# waiver -- the TS `index.ts` barrel has `index.test.ts`, the python `__init__.py`
# barrel has `__init___test.py`, empty package inits (`cli/__init__.py`) are
# auto-skipped by the tool, and the dead `cli/interpret` shells were deleted. The
# lone remaining entry waives the python isolation rule on the python barrel's
# *test* (see the block below the coverage tables); it exists only because
# testing-conventions flags a python barrel test importing its own re-exports
# while allowing the identical TS pattern -- a parity gap filed upstream.
#
# `path` is relative to the scanned source dir (packages/python/dirsql for the
# `[[python.exempt]]` entries, packages/ts/src for the `[[typescript.exempt]]`
# entries). The CLI rejects an exempt entry whose `path` matches no file, so
# this list self-cleans: delete an entry the moment its file gains a real
# colocated test (or is removed). Keep it in lockstep with the coverage-omit
# rationale in packages/python/pyproject.toml and packages/ts/vitest.config.ts.
#
# Floors: AGENTS.md mandates >=90% per SDK; both bindings currently hold the
# stricter 100% unit-only floor below (the honest maximum, no waivers needed).
# Rust (added #295) is measured unit-only via `cargo llvm-cov --lib --features
# cli`: the CLI now scopes to `--lib` and passes `[rust].features` through
# (testing-conventions #269/#270/#271). Its floors sit below the bindings' 100%
# because effectful code (filesystem / subprocess / HTTP / `notify`) lives in
# the integration tier by design (#233), so the unit tier cannot reach it.
# In #354 pure unit tests were added to close the reachable unit-tier gaps and
# the floors were then pulled up as high as they robustly go (lines 94 /
# regions 93 / functions 91 / branch 75); `branch` keeps a documented sub-90
# floor as an accepted exception -- see the `[rust.coverage]` block below for
# the rationale and a fragility warning about the near-zero slack.

# --- Python (scanned: packages/python/dirsql) ------------------------------

# The public barrel `__init__.py` is verified by its colocated test
# `__init___test.py` (asserts it re-exports exactly DirSQL/Table/RowEvent/
# __version__) -- so it needs no `colocated-test` waiver. But verifying a
# re-export barrel requires importing the surface it re-exports, which the
# python isolation rule flags as unmocked collaborators; mocking them would make
# the test assert nothing. The TS barrel test (`index.test.ts`) imports its
# barrel and passes the equivalent TS rule, so this is a python/ts parity gap in
# testing-conventions (filed upstream). We waive the isolation rule on the test
# -- not the colocated-test rule on the barrel -- so the re-exports stay
# genuinely verified. This is the ONLY remaining exemption.
[[python.exempt]]
path = "__init___test.py"
rules = ["unmocked-collaborator"]
reason = "Barrel test must import the public surface it verifies (`from . import DirSQL, Table, RowEvent, __version__, __all__`); the python isolation rule flags these as unmocked collaborators while the equivalent TS barrel test (index.test.ts) passes -- a testing-conventions python/ts parity gap (filed upstream). Waiving isolation on the test keeps the barrel's re-exports genuinely verified rather than leaving the barrel untested."

# Unit-only coverage floor (branch coverage on, matching the prior --cov-branch).
[python.coverage]
fail_under = 100
branch = true

# --- TypeScript (scanned: packages/ts/src) ---------------------------------

# Unit-only coverage floor, per vitest metric.
[typescript.coverage]
lines = 100
functions = 100
statements = 100
branches = 100

# --- Rust (scanned: packages/rust/src) -------------------------------------

# `features` is forwarded to `cargo llvm-cov --features` (and cargo-mutants) so
# the `#[cfg(feature = "cli")]` module is compiled, measured, and mutated
# (testing-conventions #270). Without it the whole CLI module compiles out and
# is silently unmeasured.
[rust]
features = ["cli"]

# Unit-only coverage floor: measured by `cargo llvm-cov --lib --features cli`
# (the `--lib` scoping keeps the integration tier under packages/rust/tests/ out
# of the number -- testing-conventions #269). `branch` runs under `--branch`,
# which needs the nightly toolchain pinned in rust-test.yml's coverage job.
#
# The floors are BELOW the bindings' 100% because the effectful paths in
# lib.rs / cli/*.rs / watcher.rs are exercised at the integration/e2e tier by
# design (#233), not the unit tier.
#
# #354 first added pure unit tests to close the reachable unit-tier gaps
# (cli/router.rs `parse_sql_body`, cli/mod.rs `with_query_timeout` /
# `From<String>`, cli/init.rs error `Display` arms), lifting the measured
# unit-only coverage to lines 94.1% / regions 93.2% / functions 91.6% /
# branch 75.6%. The floors below are then set as HIGH as they robustly go --
# the highest integer under each actual:
#   - lines: 94 (actual 94.1%).
#   - regions: 93 (actual 93.2%).
#   - functions: 91 (actual 91.6%).
#   - branch: 75 (actual 75.6%), kept BELOW the >=90% ideal as an accepted,
#     documented exception (see reasons below).
#
# WARNING -- these floors are pinned near their actuals (<1pt of slack), by
# maintainer request. The whole-tree gate will therefore go red on any PR that
# lowers a dimension even slightly. This is MOST fragile for `branch`: because
# `--branch` counts test-assertion guards (reason (2) below), a PR that merely
# ADDS well-formed unit tests can lower branch % and trip the floor. When that
# happens the fix is usually to nudge the affected floor DOWN to the new actual,
# not to treat the dip as a regression to chase.
#
# Why `branch` in particular cannot reach the >=90% ideal at the unit tier:
#   (1) The effectful production branches live in the integration/e2e tier by
#       design (#233): cli/router.rs's async HTTP handlers, cli/init.rs's
#       `claude`-spawn arms, and lib.rs's racy-window/watcher/persist error arms
#       are unreachable from a unit test; covering them re-litigates #233.
#   (2) `--branch` instruments the crate WITH its `#[cfg(test)]` modules, so
#       every `matches!(…, if a && b)` / `assert!(x && y)` guard in a unit test
#       adds short-circuit sub-condition branches whose False arm is unreachable
#       by construction (the assertion is written to pass). differ.rs is the
#       clearest case: 100% line/region/function coverage but 58% branch, every
#       uncovered branch inside a test-module guard, not production code.
[rust.coverage]
lines = 94
functions = 91
regions = 93
branch = 75
