# testing-conventions CLI config (https://github.com/thekevinscott/testing-conventions).
#
# Drives the `unit location` colocation gate wired up in
# scripts/check-testing-conventions.sh and
# .github/workflows/testing-conventions.yml. The CLI reads this file by
# default and fails on any source file that lacks a colocated unit test and
# is not listed below -- so the gate is blocking, and exemptions are the rare,
# documented exception rather than the escape hatch.
#
# `path` is relative to the scanned source dir (packages/python/dirsql for the
# `[[python.exempt]]` entries, packages/ts/src for the `[[typescript.exempt]]`
# entries). The CLI rejects an exempt entry whose `path` matches no file, so
# this list self-cleans: delete an entry the moment its file gains a real
# colocated test (or is removed). Keep it in lockstep with the coverage-omit
# rationale in packages/python/pyproject.toml and packages/ts/vitest.config.ts.

# --- Python (scanned: packages/python/dirsql) ------------------------------

[[python.exempt]]
path = "__init__.py"
rules = ["location"]
reason = "Package barrel: re-exports the public API (DirSQL, Table, RowEvent, __version__). Covered by the SDK integration tests; no isolated logic to unit-test."

[[python.exempt]]
path = "cli/__init__.py"
rules = ["location"]
reason = "Package docstring only; no logic to unit-test."

[[python.exempt]]
path = "cli/interpret/__init__.py"
rules = ["location"]
reason = "Package docstring only (no top-level re-exports, by design); no logic to unit-test."

# --- TypeScript (scanned: packages/ts/src) ---------------------------------

[[typescript.exempt]]
path = "index.ts"
rules = ["location"]
reason = "Barrel: re-exports the public API surface (DirSQL, Table, types). Covered by the SDK integration tests; no isolated logic to unit-test."

[[typescript.exempt]]
path = "cli/interpret/index.ts"
rules = ["location"]
reason = "Barrel: single re-export of `interpret`. Covered transitively by the interpret unit tests; no isolated logic to unit-test."

[[typescript.exempt]]
path = "cli/dirsql.ts"
rules = ["location"]
reason = "npm `bin` launcher shim: imports `main` and invokes it at load. Exercised end-to-end by the pack-install smoke test; mirrors the coverage-omit in packages/ts/vitest.config.ts."
