# Dedicated testing-conventions config for the repo-only internals/checks package.
#
# Identical in effect to the root testing-conventions.toml for this package's gates
# (python coverage floor 100 + branch, zero exemptions) EXCEPT it deliberately omits
# the root's `[e2e] extra_scope = ["packages/rust/src"]`.
#
# That extra_scope exists so a shared-core change re-stales the two BINDINGS'
# attestations (the rust core compiles into the `dirsql` binary their e2e suites
# spawn). internals/checks compiles none of it -- its `dirsql-checks` CLI only
# fnmatches changed-file *path strings* (see changelog_gate/decide.py), so its e2e
# output is independent of packages/rust/src's contents. detect.py applies the
# global `[e2e]` block to every caller that reads the config, so without this file
# internals/checks inherits the core scope and every rust-core PR spuriously stales
# internals/checks/e2e-attestation.json (#550). Scoping this package to its own
# config drops that phantom freshness root; a change to decide.py's path list still
# stales the attestation through the normal --scope internals/checks/src walk.
[python.coverage]
fail_under = 100
branch = true
