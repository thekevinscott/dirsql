[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Repo-only: packaging distcheck flows extracted from the former per-package packaging suites (#520,
# epic #517). Never published to an index -- run via
# `uv run --project internals/distcheck dirsql-distcheck <flow>`.
name = "dirsql-distcheck"
version = "0"
description = "Repo-only packaging distcheck flows for dirsql, run via .github/workflows."
requires-python = ">=3.11"
dependencies = ["click>=8.1"]

[project.scripts]
# A single entry point for the whole suite -- the click group in `distcheck/cli.py`
# that composes each flow as a subcommand (`python`, `node`).
dirsql-distcheck = "distcheck.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "pytest-describe>=2"]

[tool.hatch.build]
exclude = ["**/*_test.py"]

[tool.hatch.build.targets.wheel]
packages = ["src/distcheck"]

[tool.pytest.ini_options]
# `src` layout: put it on the path so flows and their colocated tests import
# the package normally (`from distcheck import ...`), no per-file sys.path hack.
pythonpath = ["src"]
